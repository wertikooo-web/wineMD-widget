<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>История знаний · Wine.md</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#241815;background:#f5f2ef}*{box-sizing:border-box}body{margin:0}.shell{max-width:1400px;margin:22px auto;padding:0 18px}.top,.filters,.actions,.pager{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.panel{background:#fff;border:1px solid #e4d9d3;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 10px 30px rgba(60,25,34,.06)}button,input,select,textarea{font:inherit;border:1px solid #cfc3bd;border-radius:9px;padding:10px;background:#fff}button{font-weight:750;cursor:pointer}button.primary{background:#6e1634;color:#fff;border-color:#6e1634}button.danger{background:#8e2337;color:#fff;border-color:#8e2337}button:disabled{opacity:.55}.filters input{min-width:220px;flex:1}.table{width:100%;border-collapse:collapse;margin-top:14px}.table th,.table td{padding:11px 9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.table th{font-size:12px;text-transform:uppercase;color:#746761}.link{font-weight:800;color:#5b1b35;cursor:pointer}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#eee7e3;font-size:12px;font-weight:700}.muted{color:#756862}.small{font-size:13px}.pager{justify-content:space-between;margin-top:14px}.drawer{position:fixed;inset:0;background:rgba(31,20,18,.42);display:flex;justify-content:flex-end;z-index:20}.drawer.hidden{display:none}.drawer-card{width:min(900px,100%);height:100%;overflow:auto;background:#fff;padding:24px}.drawer-head{display:flex;justify-content:space-between;gap:12px}.json{white-space:pre-wrap;word-break:break-word;background:#faf7f5;border:1px solid #eadfda;border-radius:10px;padding:12px;font-family:ui-monospace,monospace;font-size:12px}.warn{background:#fff6df;border:1px solid #e6c66b;padding:12px;border-radius:10px}.error{color:#9c1c2f}.toast{position:fixed;right:22px;bottom:22px;background:#241815;color:#fff;padding:12px 16px;border-radius:10px;z-index:40}.hidden{display:none!important}@media(max-width:780px){.table{display:block;overflow:auto}.filters>*{width:100%}.drawer-card{width:100%}}
</style></head><body><main class="shell"><div class="top"><div><h1 style="margin:0">История изменений знаний</h1><div class="muted">Кто, когда и что изменил. Безопасный откат доступен только для последнего изменения записи.</div></div><div class="actions"><button onclick="location.href='/admin/knowledge-studio.html'">Knowledge Studio</button><button onclick="location.href='/admin/'">Admin</button><button id="refresh" class="primary">Обновить</button></div></div>
<section class="panel"><div class="filters"><input id="search" placeholder="Комментарий, действие или ID"><select id="targetType"><option value="">Все объекты</option><option value="entity">Сущности</option><option value="fact">Факты</option></select><input id="action" placeholder="Действие: edit, verify, merge…"><input id="actor" placeholder="Администратор"><button id="apply" class="primary">Найти</button></div><div id="meta" class="muted small" style="margin-top:12px"></div><div id="content"></div><div class="pager"><button id="prev">Назад</button><span id="pageInfo" class="muted"></span><button id="next">Дальше</button></div></section></main>
<div id="drawer" class="drawer hidden"><section class="drawer-card"><div class="drawer-head"><div><h2 id="title"></h2><div id="subtitle" class="muted"></div></div><button id="close">Закрыть</button></div><div id="body"></div></section></div><div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id);let offset=0,total=0,limit=50,current=null;
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='/admin/';throw new Error('Нужно войти в Admin')}if(!r.ok){const e=new Error(d.message||d.error||'Ошибка запроса');e.code=d.error;e.newerActionId=d.newerActionId;throw e}return d}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m,bad=false){const e=$('toast');e.textContent=m;e.style.background=bad?'#8e2337':'#241815';e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3000)}
function label(i){return i.target_name||i.target_id}
async function load(){const q=new URLSearchParams({query:$('search').value.trim(),targetType:$('targetType').value,action:$('action').value.trim(),actor:$('actor').value.trim(),limit:String(limit),offset:String(offset)});$('content').innerHTML='<p class="muted">Загрузка…</p>';try{const d=await api('/api/admin/knowledge-studio/audit?'+q);total=d.total;$('meta').textContent=`Найдено: ${total}`;$('pageInfo').textContent=`${total?offset+1:0}–${Math.min(offset+limit,total)} из ${total}`;$('prev').disabled=offset===0;$('next').disabled=offset+limit>=total;$('content').innerHTML=d.items.length?`<table class="table"><thead><tr><th>Когда</th><th>Объект</th><th>Действие</th><th>Кто</th><th>Комментарий</th><th>Откат</th></tr></thead><tbody>${d.items.map(i=>`<tr><td>${new Date(i.created_at).toLocaleString('ru-RU')}</td><td><span class="link" data-id="${esc(i.id)}">${esc(label(i))}</span><div class="muted small">${esc(i.target_type)} · ${esc(i.target_id)}</div></td><td><span class="badge">${esc(i.action)}</span>${i.predicate?`<div class="muted small">${esc(i.predicate)}</div>`:''}</td><td>${esc(i.actor||'admin')}</td><td>${esc(i.comment||'—')}</td><td>${i.reversible?'<span class="badge">возможен</span>':'—'}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Записей нет.</p>';document.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>openAction(e.dataset.id))}catch(e){$('content').innerHTML=`<p class="error">${esc(e.message)}</p>`}}
async function openAction(id){try{const {item}=await api('/api/admin/knowledge-studio/audit/'+encodeURIComponent(id));current=item;$('title').textContent=`${item.action} · ${label(item)}`;$('subtitle').textContent=`${new Date(item.created_at).toLocaleString('ru-RU')} · ${item.actor||'admin'} · ${item.target_type}`;$('body').innerHTML=`${item.comment?`<p>${esc(item.comment)}</p>`:''}<h3>До изменения</h3><div class="json">${esc(JSON.stringify(item.old_value,null,2))}</div><h3>После изменения</h3><div class="json">${esc(JSON.stringify(item.new_value,null,2))}</div>${item.reversible?`<div class="warn" style="margin-top:16px"><b>Откат вернёт запись к состоянию «до».</b><p>Операция разрешена, только если после этого действия запись больше не менялась.</p><textarea id="revertComment" rows="3" placeholder="Причина отката"></textarea><button id="revertBtn" class="danger" style="margin-top:10px">Откатить это изменение</button></div>`:'<p class="muted">Автоматический откат для этого типа действия отключён.</p>'}`;if(item.reversible)$('revertBtn').onclick=revertAction;$('drawer').classList.remove('hidden')}catch(e){toast(e.message,true)}}
async function revertAction(){if(!current||!confirm('Вернуть запись к предыдущему состоянию?'))return;const btn=$('revertBtn');btn.disabled=true;try{await api(`/api/admin/knowledge-studio/audit/${encodeURIComponent(current.id)}/revert`,{method:'POST',body:JSON.stringify({comment:$('revertComment').value.trim()})});toast('Изменение откатили');$('drawer').classList.add('hidden');offset=0;await load()}catch(e){toast(e.code==='NEWER_ACTION_EXISTS'?'Есть более новое изменение. Сначала проверьте его.':e.message,true);btn.disabled=false}}
$('apply').onclick=()=>{offset=0;load()};$('refresh').onclick=load;$('prev').onclick=()=>{offset=Math.max(0,offset-limit);load()};$('next').onclick=()=>{offset+=limit;load()};$('close').onclick=()=>$('drawer').classList.add('hidden');$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').classList.add('hidden')};$('search').onkeydown=e=>{if(e.key==='Enter')$('apply').click()};load();
</script></body></html>
