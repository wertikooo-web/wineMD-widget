<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WINE AI Benchmark</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#241815;background:#f5f2ef}*{box-sizing:border-box}body{margin:0}.shell{max-width:1450px;margin:22px auto;padding:0 18px}.top,.actions,.filters,.progress-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.panel{background:#fff;border:1px solid #e4d9d3;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 10px 30px rgba(60,25,34,.06)}button,input,select{font:inherit;border:1px solid #cfc3bd;border-radius:9px;padding:10px;background:#fff}button{font-weight:750;cursor:pointer}button.primary{background:#6e1634;color:#fff;border-color:#6e1634}button:disabled{opacity:.55;cursor:wait}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{border:1px solid #e5dcd7;border-radius:14px;padding:14px}.card b{font-size:25px;display:block}.muted{color:#756862}.small{font-size:13px}.progress-track{height:12px;background:#eadfda;border-radius:999px;overflow:hidden}.progress-bar{height:100%;width:0;background:#6e1634;transition:width .2s}.table{width:100%;border-collapse:collapse;margin-top:14px}.table th,.table td{padding:10px 8px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.table th{font-size:12px;text-transform:uppercase;color:#746761}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee7e3;font-size:12px;font-weight:700}.pass{background:#e4f2e8;color:#24683d}.fail{background:#f7e5e8;color:#8e2337}.link{font-weight:800;color:#5b1b35;cursor:pointer}.answer{white-space:pre-wrap;background:#faf7f5;border-radius:10px;padding:10px;margin-top:8px}.hidden{display:none!important}.error{color:#9c1c2f}.filters input{flex:1;min-width:220px}@media(max-width:760px){.table{display:block;overflow:auto}.filters>*{width:100%}}</style></head>
<body><main class="shell"><div class="top"><div><h1 style="margin:0">WINE AI Benchmark</h1><div class="muted">200 реальных вопросов, ответы production-системы и диагностика источников.</div></div><div class="actions"><button onclick="location.href='/admin/'">Admin</button><button onclick="location.href='/admin/knowledge-studio.html'">Knowledge Studio</button></div></div>
<section class="panel"><div class="actions"><button id="run" class="primary">Запустить 200 вопросов</button><button id="refresh">Проверить состояние</button></div><p class="muted small">Полный прогон использует настроенного провайдера ответов и может занять время и расходовать API-квоту.</p><div id="status" class="muted"></div><div id="progress" class="hidden"><div class="progress-head"><b id="progressText"></b><span id="progressMeta" class="muted"></span></div><div class="progress-track"><div id="bar" class="progress-bar"></div></div></div><div id="error" class="error"></div></section>
<section id="summaryPanel" class="panel hidden"><h2>Результат</h2><div id="summary" class="cards"></div><h3>По категориям</h3><div id="categories"></div></section>
<section id="resultsPanel" class="panel hidden"><div class="filters"><input id="search" placeholder="Поиск по вопросу, ответу или диагнозу"><select id="filter"><option value="">Все результаты</option><option value="pass">Только успешно</option><option value="fail">Только ошибки</option></select></div><div id="results"></div></section></main>
<script>
const $=id=>document.getElementById(id);let jobId=null,runData=null,timer=null;
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='/admin/';throw new Error('Нужно войти в Admin')}if(!r.ok)throw new Error(d.message||d.error||'Ошибка запроса');return d}
function pct(value){return `${Math.round(Number(value||0)*100)}%`}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function ensureDataset(){const state=await api('/api/admin/wine-intelligence/benchmark-mvp');if(!state.installed)await api('/api/admin/wine-intelligence/benchmark-mvp/install',{method:'POST',body:'{}'});}
async function start(){clearInterval(timer);$('error').textContent='';$('run').disabled=true;try{await ensureDataset();const d=await api('/api/admin/benchmark/datasets/wine-ai-mvp-200/run',{method:'POST',body:'{}'});jobId=d.job.jobId;$('progress').classList.remove('hidden');poll();timer=setInterval(poll,1500)}catch(e){$('error').textContent=e.message;$('run').disabled=false}}
async function poll(){if(!jobId)return;try{const d=await api('/api/admin/benchmark/run-jobs/'+encodeURIComponent(jobId));const j=d.job;const completed=j.progress?.completed??0,total=j.progress?.total??0;$('progressText').textContent=j.message||j.phase;$('progressMeta').textContent=total?`${completed}/${total}`:'';$('bar').style.width=total?`${Math.round(completed/total*100)}%`:'2%';$('status').textContent=`Статус: ${j.status}`;if(j.status==='completed'){clearInterval(timer);$('run').disabled=false;const run=await api('/api/admin/benchmark/runs/'+encodeURIComponent(j.runId));showRun(run.run)}else if(j.status==='failed'){clearInterval(timer);$('run').disabled=false;$('error').textContent=j.message||j.error}}catch(e){clearInterval(timer);$('run').disabled=false;$('error').textContent=e.message}}
function showRun(run){runData=run;$('summaryPanel').classList.remove('hidden');$('resultsPanel').classList.remove('hidden');const s=run.stats;$('summary').innerHTML=[['Пройдено',`${s.passed}/${s.total}`],['Accuracy',pct(s.accuracy)],['Средний score',pct(s.score)],['С источниками',pct(s.sourceTraceability)],['Средняя задержка',`${s.averageLatencyMs} мс`]].map(([k,v])=>`<div class="card"><span class="muted small">${k}</span><b>${v}</b></div>`).join('');$('categories').innerHTML=`<table class="table"><thead><tr><th>Категория</th><th>Пройдено</th><th>Accuracy</th><th>Score</th></tr></thead><tbody>${Object.entries(s.byCategory||{}).map(([name,row])=>`<tr><td>${esc(name)}</td><td>${row.passed}/${row.total}</td><td>${pct(row.accuracy)}</td><td>${pct(row.score)}</td></tr>`).join('')}</tbody></table>`;renderResults()}
function renderResults(){if(!runData)return;const q=$('search').value.trim().toLowerCase(),filter=$('filter').value;const rows=runData.results.filter(r=>(!q||`${r.question} ${r.answer} ${r.diagnosis}`.toLowerCase().includes(q))&&(!filter||(filter==='pass'?r.passed:!r.passed)));$('results').innerHTML=`<div class="muted small">Показано: ${rows.length}</div><table class="table"><thead><tr><th>Вопрос</th><th>Результат</th><th>Score</th><th>Источники</th><th>Задержка</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="link" onclick="this.nextElementSibling.classList.toggle('hidden')">${esc(r.question)}</span><div class="answer hidden"><b>Ответ</b><br>${esc(r.answer||'—')}<br><br><b>Проваленные проверки</b>: ${esc((r.failedChecks||[]).join(', ')||'нет')}</div></td><td><span class="badge ${r.passed?'pass':'fail'}">${esc(r.diagnosis)}</span></td><td>${pct(r.score)}</td><td>${r.sources?.length??0}</td><td>${r.latencyMs} мс</td></tr>`).join('')}</tbody></table>`}
$('run').onclick=start;$('refresh').onclick=()=>jobId&&poll();$('search').oninput=renderResults;$('filter').onchange=renderResults;api('/api/admin/wine-intelligence/benchmark-mvp').then(d=>$('status').textContent=d.installed?'Набор из 200 вопросов установлен.':'Набор установится перед первым запуском.').catch(e=>$('error').textContent=e.message);
</script></body></html>
