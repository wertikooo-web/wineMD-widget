<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WINE AI Benchmark</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#241815;background:#f5f2ef}*{box-sizing:border-box}body{margin:0}.shell{max-width:1450px;margin:22px auto;padding:0 18px}.top,.actions,.cards,.filters,.progress-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.panel{background:#fff;border:1px solid #e4d9d3;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 10px 30px rgba(60,25,34,.06)}button,input,select{font:inherit;border:1px solid #cfc3bd;border-radius:9px;padding:10px;background:#fff}button{font-weight:750;cursor:pointer}button.primary{background:#6e1634;color:#fff;border-color:#6e1634}button:disabled{opacity:.55;cursor:wait}.card{min-width:165px;flex:1;background:#faf7f5;border:1px solid #eadfda;border-radius:14px;padding:14px}.card b{display:block;font-size:28px}.muted{color:#756862}.small{font-size:13px}.bar{height:12px;background:#eee7e3;border-radius:999px;overflow:hidden}.bar>span{display:block;height:100%;background:#6e1634;width:0}.table{width:100%;border-collapse:collapse;margin-top:14px}.table th,.table td{padding:10px 8px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.table th{font-size:12px;text-transform:uppercase;color:#746761}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee7e3;font-size:12px;font-weight:750}.badge.ok{background:#e4f2e8;color:#24683d}.badge.fail{background:#f7e5e8;color:#8e2337}.badge.review{background:#fff0c9;color:#7a5900}.answer{max-width:540px;white-space:pre-wrap}.error{color:#9c1c2f}.hidden{display:none!important}.filters>*{min-width:170px}.filters input{flex:1}@media(max-width:800px){.table{display:block;overflow:auto}.filters>*{width:100%}}
</style></head><body><main class="shell"><div class="top"><div><h1 style="margin:0">WINE AI Benchmark</h1><div class="muted">200 вопросов, реальные ответы, источники и список слабых мест.</div></div><div class="actions"><button onclick="location.href='/admin/knowledge-studio.html'">Knowledge Studio</button><button onclick="location.href='/admin/'">Admin</button><button id="run" class="primary">Запустить 200 вопросов</button></div></div>
<section class="panel"><div class="progress-head"><b id="status">Готов к запуску</b><span id="progressText" class="muted"></span></div><div class="bar" style="margin-top:12px"><span id="bar"></span></div><div id="error" class="error" style="margin-top:10px"></div></section>
<section id="summary" class="panel hidden"><div class="cards"><div class="card"><span class="muted">Всего</span><b id="total">0</b></div><div class="card"><span class="muted">Автопроверка пройдена</span><b id="passed">0</b></div><div class="card"><span class="muted">Ошибки</span><b id="failed">0</b></div><div class="card"><span class="muted">Нужна ручная оценка</span><b id="review">0</b></div><div class="card"><span class="muted">Среднее время</span><b id="latency">0</b></div></div><div id="diagnoses" class="muted small" style="margin-top:14px"></div></section>
<section id="resultsPanel" class="panel hidden"><div class="filters"><input id="search" placeholder="Поиск по вопросу или ответу"><select id="category"><option value="">Все категории</option></select><select id="resultFilter"><option value="all">Все результаты</option><option value="failed">Только ошибки</option><option value="review">Нужна ручная оценка</option><option value="passed">Пройдено</option></select></div><div id="results"></div></section></main>
<script>
const $=id=>document.getElementById(id);let runData=null,jobId=null,pollTimer=null;
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='/admin/';throw new Error('Нужно войти в Admin')}if(!r.ok)throw new Error(d.message||d.error||'Ошибка запроса');return d}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setProgress(job){const total=job.total||200,done=job.completed||0;$('status').textContent=job.message||job.phase||'Выполняется';$('progressText').textContent=`${done} / ${total}`;$('bar').style.width=`${Math.min(100,total?done/total*100:0)}%`}
async function start(){if(!confirm('Запустить 200 реальных запросов к модели? Это займёт время и использует API-бюджет.'))return;$('run').disabled=true;$('error').textContent='';$('summary').classList.add('hidden');$('resultsPanel').classList.add('hidden');try{const d=await api('/api/admin/benchmark/datasets/wine-ai-mvp-200/run',{method:'POST',body:'{}'});jobId=d.job.id;setProgress(d.job);pollTimer=setTimeout(poll,800)}catch(e){$('error').textContent=e.message;$('run').disabled=false}}
async function poll(){try{const d=await api('/api/admin/benchmark/run-jobs/'+encodeURIComponent(jobId));setProgress(d.job);if(d.job.phase==='complete'&&d.job.runId){await loadRun(d.job.runId);$('run').disabled=false;return}if(d.job.phase==='failed'){throw new Error(d.job.error?.message||'Проверка завершилась ошибкой')}pollTimer=setTimeout(poll,1200)}catch(e){$('error').textContent=e.message;$('run').disabled=false}}
async function loadRun(id){const d=await api('/api/admin/benchmark/runs/'+encodeURIComponent(id));runData=d.run;renderSummary();renderResults();$('summary').classList.remove('hidden');$('resultsPanel').classList.remove('hidden');$('status').textContent='Проверка завершена';$('bar').style.width='100%'}
function renderSummary(){const s=runData.stats;$('total').textContent=s.total;$('passed').textContent=s.passed;$('failed').textContent=s.failed??s.total-s.passed;$('review').textContent=s.reviewRequired??0;$('latency').textContent=`${Math.round((s.averageLatencyMs||0)/100)/10} с`;$('diagnoses').textContent=Object.entries(s.diagnoses||{}).map(([k,v])=>`${k}: ${v}`).join(' · ');const categories=[...new Set(runData.results.map(x=>x.category).filter(Boolean))];$('category').innerHTML='<option value="">Все категории</option>'+categories.map(x=>`<option>${esc(x)}</option>`).join('')}
function renderResults(){if(!runData)return;const q=$('search').value.trim().toLowerCase(),cat=$('category').value,filter=$('resultFilter').value;const rows=runData.results.filter(x=>(!q||`${x.question} ${x.answer||''}`.toLowerCase().includes(q))&&(!cat||x.category===cat)&&(filter==='all'||filter==='failed'&&!x.passed||filter==='review'&&x.reviewRequired||filter==='passed'&&x.passed&&!x.reviewRequired));$('results').innerHTML=rows.length?`<table class="table"><thead><tr><th>Результат</th><th>Вопрос</th><th>Ответ</th><th>Источники</th><th>Время</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.passed?(x.reviewRequired?'<span class="badge review">проверить</span>':'<span class="badge ok">пройдено</span>'):'<span class="badge fail">ошибка</span>'}<div class="small muted">${esc(x.diagnosis)}</div><div class="small muted">${esc(x.category||'')}</div></td><td>${esc(x.question)}</td><td><div class="answer">${esc(x.answer||x.error?.message||'—')}</div></td><td>${(x.sources||[]).length} источн.<br>${(x.products||[]).length} товаров</td><td>${Math.round((x.latencyMs||0)/100)/10} с</td></tr>`).join('')}</tbody></table>`:'<p class="muted">По выбранным фильтрам записей нет.</p>'}
$('run').onclick=start;$('search').oninput=renderResults;$('category').onchange=renderResults;$('resultFilter').onchange=renderResults;
</script></body></html>
