<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowledge Studio · Wine.md</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#241815;background:#f5f2ef}*{box-sizing:border-box}body{margin:0}.shell{max-width:1280px;margin:24px auto;padding:0 18px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}.top h1{margin:0 0 5px}.muted{color:#756862}.panel{background:#fff;border:1px solid #e4d9d3;border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(60,25,34,.06);margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.card{border:1px solid #e6dcd7;border-radius:14px;padding:14px}.card b{display:block;font-size:25px;margin-top:4px}.tabs,.filters,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tabs button,.actions button{width:auto}.tabs button.active{background:#6e1634;color:#fff}.tabs{margin-bottom:16px}button,input,select,textarea{font:inherit;border:1px solid #cfc3bd;border-radius:9px;padding:10px;background:#fff}button{background:#eee7e3;color:#4b3630;font-weight:700;cursor:pointer}button.primary{background:#6e1634;color:#fff;border-color:#6e1634}button.danger{background:#8e2337;color:#fff;border-color:#8e2337}input{min-width:220px;flex:1}.table{width:100%;border-collapse:collapse;margin-top:14px}.table th,.table td{padding:11px 9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.table th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#746761}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#eee7e3;font-size:12px;font-weight:700}.badge.verified,.badge.published{background:#e4f2e8;color:#24683d}.badge.needs_review{background:#fff0c9;color:#7a5900}.badge.rejected{background:#f7e5e8;color:#8e2337}.name{font-weight:800;color:#4d1c2e;cursor:pointer}.hidden{display:none!important}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.drawer{position:fixed;inset:0;background:rgba(31,20,18,.38);display:flex;justify-content:flex-end;z-index:20}.drawer-card{width:min(680px,100%);height:100%;overflow:auto;background:#fff;padding:24px;box-shadow:-10px 0 30px rgba(0,0,0,.12)}.drawer-head{display:flex;justify-content:space-between;gap:12px}.drawer h2{margin-top:0}.fact{border:1px solid #e5dcd7;border-radius:12px;padding:14px;margin:10px 0}.fact-line{font-weight:750}.quote{background:#faf7f5;border-left:3px solid #b98f9e;padding:10px;margin-top:8px;white-space:pre-wrap}.error{color:#9c1c2f}.success{color:#24683d}.empty{padding:28px;text-align:center;color:#756862}.small{font-size:13px}@media(max-width:760px){.top{flex-direction:column}.table{display:block;overflow:auto}.filters>*{width:100%}.drawer-card{width:100%}}
</style>
</head>
<body>
<main class="shell">
  <div class="top">
    <div><h1>Knowledge Studio</h1><div class="muted">Сущности, факты, связи, источники и ручная проверка.</div></div>
    <div class="actions"><button onclick="location.href='/admin/'">Назад в Admin</button><button id="refresh" class="primary">Обновить</button></div>
  </div>

  <section class="panel"><div id="overview" class="cards"></div><div id="overviewError" class="error"></div></section>

  <section class="panel">
    <div class="tabs">
      <button id="tabEntities" class="active">Сущности</button>
      <button id="tabFacts">Факты</button>
      <button id="tabReview">Требует проверки</button>
    </div>

    <div class="filters">
      <input id="search" placeholder="Поиск по названию, алиасам и значениям">
      <select id="typeFilter"><option value="">Все типы</option></select>
      <select id="statusFilter"><option value="">Все статусы</option><option>extracted</option><option>needs_review</option><option>verified</option><option>published</option><option>rejected</option></select>
      <select id="predicateFilter" class="hidden"><option value="">Все связи</option></select>
      <button id="apply" class="primary">Найти</button>
    </div>

    <div id="resultMeta" class="muted small" style="margin-top:12px"></div>
    <div id="content"></div>
    <div class="pager"><button id="prev">Назад</button><span id="pageInfo" class="muted"></span><button id="next">Дальше</button></div>
  </section>
</main>

<div id="drawer" class="drawer hidden"><section class="drawer-card"><div class="drawer-head"><div><h2 id="drawerTitle"></h2><div id="drawerMeta" class="muted"></div></div><button id="drawerClose">Закрыть</button></div><div id="drawerBody"></div></section></div>

<script>
const $=id=>document.getElementById(id);let mode='entities',offset=0,total=0,limit=40,predicates=[];
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});let data={};try{data=await r.json()}catch{}if(r.status===401){location.href='/admin/';throw new Error('Нужно войти в Admin')}if(!r.ok)throw new Error(data.message||data.error||'Ошибка запроса');return data}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function badge(status){return `<span class="badge ${esc(status)}">${esc(status)}</span>`}
async function loadOverview(){try{const {overview}=await api('/api/admin/knowledge-studio/overview');$('overview').innerHTML=[['Документы',overview.documents],['Chunks',overview.chunks],['Сущности',overview.entities],['Факты',overview.facts],['Проверено',overview.verified],['Опубликовано',overview.published],['Требует проверки',overview.needs_review],['Без источника',overview.facts_without_source],['Wine.md товары',overview.catalog_products],['Не сопоставлено',overview.catalog_unmatched]].map(([a,b])=>`<div class="card"><span>${a}</span><b>${b??0}</b></div>`).join('')}catch(e){$('overviewError').textContent=e.message}}
async function loadPredicates(){const data=await api('/api/admin/knowledge-studio/predicates');predicates=data.predicates||[];$('predicateFilter').innerHTML='<option value="">Все связи</option>'+predicates.map(p=>`<option value="${esc(p.predicate)}">${esc(p.label_ru)} (${esc(p.predicate)})</option>`).join('')}
function valueOf(f){if(f.object_name)return f.object_name;if(f.text_value!=null)return f.text_value;if(f.number_value!=null)return `${f.number_value}${f.unit?' '+f.unit:''}`;if(f.date_value)return f.date_value;return '—'}
async function load(){const q=encodeURIComponent($('search').value.trim());$('content').innerHTML='<div class="empty">Загрузка…</div>';try{if(mode==='entities'){const type=encodeURIComponent($('typeFilter').value),status=encodeURIComponent($('statusFilter').value);const d=await api(`/api/admin/knowledge-studio/entities?query=${q}&type=${type}&status=${status}&limit=${limit}&offset=${offset}`);total=d.total;$('content').innerHTML=d.items.length?`<table class="table"><thead><tr><th>Название</th><th>Тип</th><th>Алиасы</th><th>Факты</th><th>Источники</th><th>Статус</th></tr></thead><tbody>${d.items.map(e=>`<tr><td><span class="name" data-id="${esc(e.id)}">${esc(e.canonical_name)}</span><div class="muted small">${esc(e.short_description||'')}</div></td><td>${esc(e.entity_type)}</td><td>${esc((e.aliases||[]).slice(0,4).join(', '))}</td><td>${e.fact_count}</td><td>${e.source_count}</td><td>${badge(e.status)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Ничего не найдено.</div>';document.querySelectorAll('.name').forEach(x=>x.onclick=()=>openEntity(x.dataset.id));}else{const predicate=encodeURIComponent($('predicateFilter').value),status=encodeURIComponent($('statusFilter').value);const d=await api(`/api/admin/knowledge-studio/facts?query=${q}&predicate=${predicate}&status=${status}&needsReview=${mode==='review'}&limit=${limit}&offset=${offset}`);total=d.total;$('content').innerHTML=d.items.length?`<table class="table"><thead><tr><th>Факт</th><th>Уверенность</th><th>Источники</th><th>Статус</th><th></th></tr></thead><tbody>${d.items.map(f=>`<tr><td><div><b>${esc(f.subject_name)}</b> · ${esc(f.label_ru||f.predicate)} · <b>${esc(valueOf(f))}</b></div><div class="muted small">${esc(f.predicate)}</div></td><td>${Math.round(Number(f.confidence||0)*100)}%</td><td>${f.source_count}</td><td>${badge(f.status)}</td><td><div class="actions"><button onclick="review('${esc(f.id)}','verify')">Подтвердить</button><button onclick="review('${esc(f.id)}','publish')">Опубликовать</button><button class="danger" onclick="review('${esc(f.id)}','reject')">Отклонить</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Ничего не найдено.</div>'}$('resultMeta').textContent=`Найдено: ${total}`;$('pageInfo').textContent=`${total?offset+1:0}–${Math.min(offset+limit,total)} из ${total}`;$('prev').disabled=offset===0;$('next').disabled=offset+limit>=total}catch(e){$('content').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function openEntity(id){const {entity}=await api('/api/admin/knowledge-studio/entities/'+encodeURIComponent(id));$('drawerTitle').textContent=entity.canonical_name;$('drawerMeta').textContent=`${entity.entity_type} · ${entity.status}`;$('drawerBody').innerHTML=`<h3>Алиасы</h3><p>${esc((entity.aliases||[]).map(a=>a.alias).join(', ')||'Нет')}</p><h3>Описания</h3>${(entity.descriptions||[]).map(d=>`<div class="fact"><div>${esc(d.description)}</div><div class="muted small">Язык: ${esc(d.language||'—')} · документ: ${esc(d.documentId||'—')} · chunk: ${esc(d.chunkId||'—')}</div></div>`).join('')||'<p class="muted">Нет описаний.</p>'}<h3>Факты</h3>${(entity.facts||[]).map(f=>`<div class="fact"><div class="fact-line">${esc(entity.canonical_name)} · ${esc(f.label_ru||f.predicate)} · ${esc(valueOf(f))}</div><div class="muted small">${Math.round(Number(f.confidence||0)*100)}% · ${esc(f.status)} · ${esc(f.predicate)}</div>${(f.sources||[]).map(s=>`<div class="quote"><b>${esc(s.documentTitle||'Источник')}</b>${s.pageNumber?' · стр. '+esc(s.pageNumber):''}<br>${esc(s.quote||'Цитата отсутствует')}</div>`).join('')}</div>`).join('')||'<p class="muted">Нет фактов.</p>'}`;$('drawer').classList.remove('hidden')}
async function review(id,action){const comment=prompt('Комментарий к действию (можно оставить пустым):','')??'';try{await api(`/api/admin/knowledge-studio/facts/${encodeURIComponent(id)}/review`,{method:'POST',body:JSON.stringify({action,comment})});await Promise.all([load(),loadOverview()])}catch(e){alert(e.message)}}
function switchMode(next){mode=next;offset=0;['Entities','Facts','Review'].forEach(x=>$('tab'+x).classList.toggle('active',x.toLowerCase()===next));$('typeFilter').classList.toggle('hidden',mode!=='entities');$('predicateFilter').classList.toggle('hidden',mode==='entities');load()}
$('tabEntities').onclick=()=>switchMode('entities');$('tabFacts').onclick=()=>switchMode('facts');$('tabReview').onclick=()=>switchMode('review');$('apply').onclick=()=>{offset=0;load()};$('search').onkeydown=e=>{if(e.key==='Enter')$('apply').click()};$('prev').onclick=()=>{offset=Math.max(0,offset-limit);load()};$('next').onclick=()=>{offset+=limit;load()};$('refresh').onclick=()=>Promise.all([loadOverview(),load()]);$('drawerClose').onclick=()=>$('drawer').classList.add('hidden');$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').classList.add('hidden')};
(async()=>{await Promise.all([loadOverview(),loadPredicates()]);await load();})();
</script>
</body>
</html>
