<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowledge Studio · Wine.md</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#241815;background:#f5f2ef}*{box-sizing:border-box}body{margin:0}.shell{max-width:1380px;margin:22px auto;padding:0 18px}.row,.top,.tabs,.filters,.actions,.pager,.chips{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between;align-items:flex-start}.panel{background:#fff;border:1px solid #e4d9d3;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 10px 30px rgba(60,25,34,.06)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.card{border:1px solid #e6dcd7;border-radius:14px;padding:14px}.card b{display:block;font-size:24px;margin-top:4px}.muted{color:#756862}.small{font-size:13px}button,input,select,textarea{font:inherit;border:1px solid #cfc3bd;border-radius:9px;padding:10px;background:#fff}button{font-weight:750;cursor:pointer}button.primary,.tabs .active{background:#6e1634;color:#fff;border-color:#6e1634}button.danger{background:#8e2337;color:#fff;border-color:#8e2337}button:disabled{opacity:.55;cursor:wait}input,textarea{width:100%}.filters input{min-width:260px;flex:1}.table{width:100%;border-collapse:collapse;margin-top:14px}.table th,.table td{padding:11px 9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.table th{font-size:12px;text-transform:uppercase;color:#746761;white-space:nowrap}.link{font-weight:800;color:#5b1b35;cursor:pointer}.badge,.chip{display:inline-block;padding:4px 9px;border-radius:999px;background:#eee7e3;font-size:12px;font-weight:700}.badge.verified,.badge.published{background:#e4f2e8;color:#24683d}.badge.needs_review{background:#fff0c9;color:#7a5900}.badge.rejected{background:#f7e5e8;color:#8e2337}.hidden{display:none!important}.pager{justify-content:space-between;margin-top:14px}.drawer{position:fixed;inset:0;background:rgba(31,20,18,.42);display:flex;justify-content:flex-end;z-index:20}.drawer-card{width:min(860px,100%);height:100%;overflow:auto;background:#fff;padding:24px}.drawer-head{display:flex;justify-content:space-between;gap:12px}.fact,.history,.editor,.merge-box{border:1px solid #e5dcd7;border-radius:12px;padding:14px;margin:10px 0}.editor,.merge-box{background:#fcfaf9}.quote{background:#faf7f5;border-left:3px solid #b98f9e;padding:10px;margin-top:8px;white-space:pre-wrap}.error{color:#9c1c2f}.empty{padding:28px;text-align:center;color:#756862}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;color:#746761;margin-bottom:6px}.alias-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.alias-row span{flex:1}.toast{position:fixed;right:22px;bottom:22px;z-index:40;background:#241815;color:#fff;padding:12px 16px;border-radius:10px}.warn{background:#fff6df;border:1px solid #e6c66b;padding:12px;border-radius:10px}@media(max-width:780px){.table{display:block;overflow:auto}.filters>*{width:100%}.drawer-card{width:100%}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
<div class="top"><div><h1 style="margin:0">Knowledge Studio</h1><div class="muted">Сущности, факты, источники и безопасная ручная правка.</div></div><div class="actions"><button onclick="location.href='/admin/'">Admin</button><button onclick="location.href='/admin/fact-editor.html'">Редактор фактов</button><button onclick="location.href='/admin/knowledge-audit.html'">Журнал изменений</button><button id="refresh" class="primary">Обновить</button></div></div>
<section class="panel"><div id="overview" class="cards"></div><div id="types" class="chips" style="margin-top:14px"></div><div id="overviewError" class="error"></div></section>
<section class="panel"><div class="tabs"><button id="tabEntities" class="active">Сущности</button><button id="tabFacts">Факты</button><button id="tabReview">Требует проверки</button></div>
<div class="filters"><input id="search" placeholder="Поиск"><select id="typeFilter"><option value="">Все типы</option></select><select id="statusFilter"><option value="">Все статусы</option><option>extracted</option><option>needs_review</option><option>verified</option><option>published</option><option>rejected</option></select><select id="predicateFilter" class="hidden"><option value="">Все связи</option></select><select id="sort"><option value="name">По имени</option><option value="type">По типу</option><option value="facts">По числу фактов</option><option value="sources">По источникам</option><option value="updated">По дате изменения</option></select><select id="order"><option value="asc">По возрастанию</option><option value="desc">По убыванию</option></select><button id="apply" class="primary">Найти</button></div>
<div id="meta" class="muted small" style="margin-top:12px"></div><div id="content"></div><div class="pager"><button id="prev">Назад</button><span id="pageInfo" class="muted"></span><button id="next">Дальше</button></div></section>
</main>
<div id="drawer" class="drawer hidden"><section class="drawer-card"><div class="drawer-head"><div><h2 id="drawerTitle"></h2><div id="drawerMeta" class="muted"></div></div><button id="drawerClose">Закрыть</button></div><div id="drawerBody"></div></section></div>
<div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id);let mode='entities',offset=0,total=0,limit=50,predicates=[],currentEntity=null;
const entityTypes=['winery','wine','wine_line','grape_variety','wine_region','geographic_place','terroir','aroma','flavor','food','dish','tradition','historical_event','person','organization','wine_route','tour','tasting','event','shop','product'];
const statuses=['extracted','needs_review','verified','published','rejected'];
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='/admin/';throw new Error('Нужно войти в Admin')}if(!r.ok){const e=new Error(d.message||d.error||'Ошибка запроса');e.data=d;throw e}return d}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function badge(s){return `<span class="badge ${esc(s)}">${esc(s)}</span>`}
function valueOf(f){return f.object_name??f.text_value??(f.number_value!=null?`${f.number_value}${f.unit?' '+f.unit:''}`:null)??f.date_value??'—'}
function toast(message,error=false){const el=$('toast');el.textContent=message;el.style.background=error?'#8e2337':'#241815';el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2600)}
async function loadOverview(){try{const {overview:o}=await api('/api/admin/knowledge-studio/overview');$('overview').innerHTML=[['Документы',o.documents],['Chunks',o.chunks],['Сущности',o.entities],['Факты',o.facts],['Без фактов',o.entities_without_facts],['Проверено',o.verified],['Опубликовано',o.published],['Требует проверки',o.needs_review],['Без источника',o.facts_without_source],['Wine.md товары',o.catalog_products]].map(([a,b])=>`<div class="card"><span>${a}</span><b>${b??0}</b></div>`).join('');const types=o.entity_types||[];$('types').innerHTML=types.map(t=>`<button class="chip" data-type="${esc(t.entity_type)}">${esc(t.entity_type)} · ${t.count}</button>`).join('');$('typeFilter').innerHTML='<option value="">Все типы</option>'+types.map(t=>`<option value="${esc(t.entity_type)}">${esc(t.entity_type)} (${t.count})</option>`).join('');document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{$('typeFilter').value=b.dataset.type;mode='entities';offset=0;load()})}catch(e){$('overviewError').textContent=e.message}}
async function loadPredicates(){const d=await api('/api/admin/knowledge-studio/predicates');predicates=d.predicates||[];$('predicateFilter').innerHTML='<option value="">Все связи</option>'+predicates.map(p=>`<option value="${esc(p.predicate)}">${esc(p.label_ru)} (${esc(p.predicate)})</option>`).join('')}
function setMode(next){mode=next;offset=0;['Entities','Facts','Review'].forEach(x=>$('tab'+x).classList.toggle('active',x.toLowerCase()===next));$('typeFilter').classList.toggle('hidden',next!=='entities');$('predicateFilter').classList.toggle('hidden',next==='entities');$('sort').innerHTML=next==='entities'?'<option value="name">По имени</option><option value="type">По типу</option><option value="facts">По числу фактов</option><option value="sources">По источникам</option><option value="updated">По дате изменения</option>':'<option value="updated">По дате изменения</option><option value="confidence">По уверенности</option><option value="subject">По субъекту</option><option value="predicate">По связи</option><option value="sources">По источникам</option>';load()}
async function load(){const query=$('search').value.trim(),status=$('statusFilter').value,sort=$('sort').value,order=$('order').value;$('content').innerHTML='<div class="empty">Загрузка…</div>';try{let d;if(mode==='entities')d=await api(`/api/admin/knowledge-studio/entities?query=${encodeURIComponent(query)}&type=${encodeURIComponent($('typeFilter').value)}&status=${encodeURIComponent(status)}&sort=${sort}&order=${order}&limit=${limit}&offset=${offset}`);else d=await api(`/api/admin/knowledge-studio/facts?query=${encodeURIComponent(query)}&predicate=${encodeURIComponent($('predicateFilter').value)}&status=${encodeURIComponent(status)}&needsReview=${mode==='review'}&sort=${sort}&order=${order}&limit=${limit}&offset=${offset}`);total=d.total;if(mode==='entities'){$('content').innerHTML=d.items.length?`<table class="table"><thead><tr><th>Название</th><th>Тип</th><th>Факты</th><th>Источники</th><th>Статус</th></tr></thead><tbody>${d.items.map(e=>`<tr><td><span class="link entity-link" data-id="${esc(e.id)}">${esc(e.canonical_name)}</span><div class="muted small">${esc(e.short_description||'')}</div></td><td>${esc(e.entity_type)}</td><td>${e.fact_count}</td><td>${e.source_count}</td><td>${badge(e.status)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Ничего не найдено.</div>';document.querySelectorAll('.entity-link').forEach(x=>x.onclick=()=>openEntity(x.dataset.id))}else{$('content').innerHTML=d.items.length?`<table class="table"><thead><tr><th>Факт</th><th>Уверенность</th><th>Источники</th><th>Статус</th></tr></thead><tbody>${d.items.map(f=>`<tr><td><span class="link fact-link" data-id="${esc(f.id)}">${esc(f.subject_name)} · ${esc(f.label_ru||f.predicate)} · ${esc(valueOf(f))}</span></td><td>${Math.round(Number(f.confidence||0)*100)}%</td><td>${f.source_count}</td><td>${badge(f.status)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Ничего не найдено.</div>';document.querySelectorAll('.fact-link').forEach(x=>x.onclick=()=>openFact(x.dataset.id))}$('meta').textContent=`Найдено: ${total}`;$('pageInfo').textContent=`${total?offset+1:0}–${Math.min(offset+limit,total)} из ${total}`;$('prev').disabled=offset===0;$('next').disabled=offset+limit>=total}catch(e){$('content').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function renderAliases(items){return items.length?items.map(a=>`<div class="alias-row"><span><b>${esc(a.alias)}</b>${a.language?` <span class="muted small">${esc(a.language)}</span>`:''}</span><button class="danger del-alias" data-id="${esc(a.id)}">Удалить</button></div>`).join(''):'<div class="muted">Алиасов нет.</div>'}
function renderEntity(entity,graph){currentEntity=entity;$('drawerTitle').textContent=entity.canonical_name;$('drawerMeta').innerHTML=`${esc(entity.entity_type)} · ${badge(entity.status)}`;$('drawerBody').innerHTML=`<div class="actions"><button class="primary" id="editBtn">Редактировать</button><button id="historyBtn">История</button><button id="mergeBtn">Объединить дубль</button></div><div id="workBox"></div><h3>Алиасы</h3><div id="aliases">${renderAliases(entity.aliases||[])}</div><div class="row"><input id="aliasInput" placeholder="Новый алиас" style="flex:1"><input id="aliasLang" placeholder="Язык" style="max-width:120px"><button id="addAlias">Добавить</button></div><h3>Факты</h3>${(entity.facts||[]).map(f=>`<div class="fact"><div class="link" onclick="openFact('${esc(f.id)}')">${esc(f.subject_name)} · ${esc(f.label_ru||f.predicate)} · ${esc(valueOf(f))}</div><div class="muted small">${esc(f.predicate)} · ${Math.round(Number(f.confidence||0)*100)}% · ${esc(f.status)}</div></div>`).join('')||'<p class="muted">Фактов нет.</p>'}`;$('editBtn').onclick=()=>showEditor(entity);$('historyBtn').onclick=showHistory;$('mergeBtn').onclick=showMerge;$('addAlias').onclick=addAlias;document.querySelectorAll('.del-alias').forEach(b=>b.onclick=()=>deleteAlias(b.dataset.id));$('drawer').classList.remove('hidden')}
function showEditor(e){$('workBox').innerHTML=`<div class="editor"><h3>Редактирование</h3><div class="grid"><div class="field"><label>Название</label><input id="editName" value="${esc(e.canonical_name)}"></div><div class="field"><label>Тип</label><select id="editType">${entityTypes.map(t=>`<option ${t===e.entity_type?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Статус</label><select id="editStatus">${statuses.map(s=>`<option ${s===e.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Комментарий</label><input id="editComment"></div></div><div class="field"><label>Описание</label><textarea id="editDescription" rows="4">${esc(e.short_description||'')}</textarea></div><button class="primary" id="saveEntity">Сохранить</button><div id="editError" class="error"></div></div>`;$('saveEntity').onclick=saveEntity}
async function saveEntity(){try{await api(`/api/admin/knowledge-studio/entities/${encodeURIComponent(currentEntity.id)}`,{method:'PUT',body:JSON.stringify({canonicalName:$('editName').value,entityType:$('editType').value,status:$('editStatus').value,shortDescription:$('editDescription').value,comment:$('editComment').value})});toast('Сущность сохранена');await refreshEntity();await Promise.all([load(),loadOverview()])}catch(e){$('editError').textContent=e.message}}
async function addAlias(){const alias=$('aliasInput').value.trim();if(!alias)return toast('Введите алиас',true);try{await api(`/api/admin/knowledge-studio/entities/${encodeURIComponent(currentEntity.id)}/aliases`,{method:'POST',body:JSON.stringify({alias,language:$('aliasLang').value.trim()||null})});toast('Алиас добавлен');await refreshEntity()}catch(e){toast(e.message,true)}}
async function deleteAlias(id){if(!confirm('Удалить алиас?'))return;try{await api(`/api/admin/knowledge-studio/entities/${encodeURIComponent(currentEntity.id)}/aliases/${encodeURIComponent(id)}`,{method:'DELETE'});toast('Алиас удалён');await refreshEntity()}catch(e){toast(e.message,true)}}
async function showHistory(){try{const d=await api(`/api/admin/knowledge-studio/entities/${encodeURIComponent(currentEntity.id)}/history`);const rows=d.items||[];$('workBox').innerHTML=`<div class="editor"><h3>История</h3>${rows.length?rows.map(h=>`<div class="history"><b>${esc(h.action)}</b><div class="muted small">${esc(h.actor||'admin')} · ${new Date(h.created_at).toLocaleString('ru-RU')}</div>${h.comment?`<p>${esc(h.comment)}</p>`:''}</div>`).join(''):'<div class="muted">История пуста.</div>'}</div>`}catch(e){toast(e.message,true)}}
function showMerge(){$('workBox').innerHTML=`<div class="merge-box"><h3>Объединение дубля</h3><div class="warn">Текущая сущность будет удалена. Факты, источники, алиасы и ссылки перейдут к выбранной основной сущности. Сначала система покажет точный план.</div><div class="field" style="margin-top:12px"><label>Найти основную сущность того же типа</label><input id="mergeSearch" placeholder="Начните вводить название"></div><div id="mergeResults"></div><div id="mergePreview"></div></div>`;let timer;$('mergeSearch').oninput=()=>{clearTimeout(timer);timer=setTimeout(searchMergeTargets,300)}}
async function searchMergeTargets(){const q=$('mergeSearch').value.trim();if(q.length<2)return $('mergeResults').innerHTML='';try{const d=await api(`/api/admin/knowledge-studio/entities?query=${encodeURIComponent(q)}&type=${encodeURIComponent(currentEntity.entity_type)}&limit=20&offset=0`);const items=d.items.filter(x=>x.id!==currentEntity.id);$('mergeResults').innerHTML=items.map(x=>`<button class="merge-target" data-id="${esc(x.id)}" style="margin:6px 6px 0 0">${esc(x.canonical_name)}</button>`).join('')||'<div class="muted">Совпадений нет.</div>';document.querySelectorAll('.merge-target').forEach(b=>b.onclick=()=>previewMerge(b.dataset.id))}catch(e){toast(e.message,true)}}
async function previewMerge(targetId){try{const d=await api(`/api/admin/knowledge-studio/entities/${encodeURIComponent(currentEntity.id)}/merge-preview`,{method:'POST',body:JSON.stringify({targetEntityId:targetId})});const p=d.preview;$('mergePreview').innerHTML=`<div class="editor"><h3>План объединения</h3><p><b>Удалить:</b> ${esc(p.source.canonical_name)} (${p.source.fact_count} фактов, ${p.source.alias_count} алиасов)</p><p><b>Оставить:</b> ${esc(p.target.canonical_name)} (${p.target.fact_count} фактов, ${p.target.alias_count} алиасов)</p><p class="muted">Каталог: ${p.references.catalog_products}, туры: ${p.references.tours}, маршруты: ${p.references.routes}, остановки: ${p.references.route_stops}</p><label><input id="confirmMerge" type="checkbox" style="width:auto"> Я проверил направление объединения</label><div class="field"><label>Комментарий</label><input id="mergeComment" placeholder="Почему это дубль"></div><button class="danger" id="executeMerge" disabled>Объединить</button></div>`;$('confirmMerge').onchange=()=>{$('executeMerge').disabled=!$('confirmMerge').checked};$('executeMerge').onclick=()=>executeMerge(targetId,p.target.canonical_name)}catch(e){toast(e.message,true)}}
async function executeMerge(targetId,targetName){if(!confirm(`Удалить «${currentEntity.canonical_name}» и перенести данные в «${targetName}»?`))return;const btn=$('executeMerge');btn.disabled=true;try{await api(`/api/admin/knowledge-studio/entities/${encodeURIComponent(currentEntity.id)}/merge`,{method:'POST',body:JSON.stringify({targetEntityId:targetId,comment:$('mergeComment').value})});toast('Сущности объединены');$('drawer').classList.add('hidden');await Promise.all([load(),loadOverview()]);await openEntity(targetId)}catch(e){toast(e.message,true);btn.disabled=false}}
async function refreshEntity(){await openEntity(currentEntity.id)}
async function openEntity(id){try{const [{entity},{graph}]=await Promise.all([api(`/api/admin/knowledge-studio/entities/${encodeURIComponent(id)}`),api(`/api/admin/knowledge-studio/entities/${encodeURIComponent(id)}/graph`)]);renderEntity(entity,graph)}catch(e){toast(e.message,true)}}
async function openFact(id){try{const {fact}=await api(`/api/admin/knowledge-studio/facts/${encodeURIComponent(id)}`);$('drawerTitle').textContent='Факт';$('drawerMeta').innerHTML=`${esc(fact.subject_name)} · ${badge(fact.status)}`;$('drawerBody').innerHTML=`<div class="actions"><button class="primary" onclick="location.href='/admin/fact-editor.html?fact=${encodeURIComponent(id)}'">Открыть в редакторе фактов</button></div><div class="fact"><b>${esc(fact.subject_name)} · ${esc(fact.label_ru||fact.predicate)} · ${esc(valueOf(fact))}</b><div class="muted small">${esc(fact.predicate)} · ${Math.round(Number(fact.confidence||0)*100)}%</div>${(fact.sources||[]).map(s=>`<div class="quote">${esc(s.quote||s.chunkText||'Источник без цитаты')}<div class="muted small">${esc(s.documentTitle||s.url||'Источник')} ${s.pageNumber?'· стр. '+esc(s.pageNumber):''}</div></div>`).join('')}</div>`;$('drawer').classList.remove('hidden')}catch(e){toast(e.message,true)}}
$('tabEntities').onclick=()=>setMode('entities');$('tabFacts').onclick=()=>setMode('facts');$('tabReview').onclick=()=>setMode('review');$('apply').onclick=()=>{offset=0;load()};$('refresh').onclick=()=>Promise.all([load(),loadOverview(),loadPredicates()]);$('prev').onclick=()=>{offset=Math.max(0,offset-limit);load()};$('next').onclick=()=>{offset+=limit;load()};$('drawerClose').onclick=()=>$('drawer').classList.add('hidden');$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').classList.add('hidden')};$('search').onkeydown=e=>{if(e.key==='Enter'){offset=0;load()}};$('typeFilter').onchange=$('statusFilter').onchange=$('predicateFilter').onchange=$('sort').onchange=$('order').onchange=()=>{offset=0;load()};
Promise.all([loadOverview(),loadPredicates()]).then(load).catch(e=>toast(e.message,true));
</script>
</body>
</html>
