<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowledge Studio · Wine.md</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#241815;background:#f5f2ef}*{box-sizing:border-box}body{margin:0}.shell{max-width:1380px;margin:22px auto;padding:0 18px}.top,.tabs,.filters,.actions,.pager,.chips,.form-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between;align-items:flex-start}.panel{background:#fff;border:1px solid #e4d9d3;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 10px 30px rgba(60,25,34,.06)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.card{border:1px solid #e6dcd7;border-radius:14px;padding:14px}.card b{display:block;font-size:24px;margin-top:4px}.muted{color:#756862}.small{font-size:13px}button,input,select,textarea{font:inherit;border:1px solid #cfc3bd;border-radius:9px;padding:10px;background:#fff}button{font-weight:750;cursor:pointer}button.primary,.tabs .active{background:#6e1634;color:#fff;border-color:#6e1634}button.danger{background:#8e2337;color:#fff;border-color:#8e2337}button:disabled{opacity:.55;cursor:wait}input,textarea{width:100%}.filters input{min-width:260px;flex:1}.filters{margin-top:14px}.table{width:100%;border-collapse:collapse;margin-top:14px}.table th,.table td{padding:11px 9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.table th{font-size:12px;text-transform:uppercase;color:#746761;white-space:nowrap}.name,.factlink{font-weight:800;color:#5b1b35;cursor:pointer}.badge,.chip{display:inline-block;padding:4px 9px;border-radius:999px;background:#eee7e3;font-size:12px;font-weight:700}.chip.active{background:#6e1634;color:#fff}.badge.verified,.badge.published{background:#e4f2e8;color:#24683d}.badge.needs_review{background:#fff0c9;color:#7a5900}.badge.rejected{background:#f7e5e8;color:#8e2337}.hidden{display:none!important}.pager{justify-content:space-between;margin-top:14px}.drawer{position:fixed;inset:0;background:rgba(31,20,18,.42);display:flex;justify-content:flex-end;z-index:20}.drawer-card{width:min(820px,100%);height:100%;overflow:auto;background:#fff;padding:24px}.drawer-head{display:flex;justify-content:space-between;gap:12px}.fact,.history-item{border:1px solid #e5dcd7;border-radius:12px;padding:14px;margin:10px 0}.quote{background:#faf7f5;border-left:3px solid #b98f9e;padding:10px;margin-top:8px;white-space:pre-wrap}.graph{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.edge{border:1px solid #eadfda;border-radius:10px;padding:10px}.error{color:#9c1c2f}.empty{padding:28px;text-align:center;color:#756862}.typehead{margin:20px 0 6px;padding-bottom:7px;border-bottom:2px solid #eadfda}.editor{border:1px solid #e5dcd7;border-radius:14px;padding:16px;margin:14px 0;background:#fcfaf9}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;color:#746761;margin-bottom:6px}.alias-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.alias-row span{flex:1}.toast{position:fixed;right:22px;bottom:22px;z-index:40;background:#241815;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2)}@media(max-width:780px){.table{display:block;overflow:auto}.filters>*{width:100%}.drawer-card{width:100%}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
<div class="top"><div><h1 style="margin:0">Knowledge Studio</h1><div class="muted">Проверка и редактирование сущностей, фактов, связей и источников.</div></div><div class="actions"><button onclick="location.href='/admin/'">Назад в Admin</button><button id="refresh" class="primary">Обновить</button></div></div>
<section class="panel"><div id="overview" class="cards"></div><div id="types" class="chips" style="margin-top:14px"></div><div id="overviewError" class="error"></div></section>
<section class="panel"><div class="tabs"><button id="tabEntities" class="active">Сущности</button><button id="tabFacts">Факты</button><button id="tabReview">Требует проверки</button></div>
<div class="filters"><input id="search" placeholder="Поиск по названию, алиасам, описанию и значениям"><select id="typeFilter"><option value="">Все типы</option></select><select id="statusFilter"><option value="">Все статусы</option><option>extracted</option><option>needs_review</option><option>verified</option><option>published</option><option>rejected</option></select><select id="predicateFilter" class="hidden"><option value="">Все связи</option></select><select id="sort"><option value="name">По имени</option><option value="type">По типу</option><option value="facts">По числу фактов</option><option value="sources">По источникам</option><option value="created">По дате создания</option><option value="updated">По дате изменения</option><option value="status">По статусу</option></select><select id="order"><option value="asc">По возрастанию</option><option value="desc">По убыванию</option></select><label class="chip"><input id="group" type="checkbox" style="width:auto"> Группировать</label><button id="apply" class="primary">Найти</button></div>
<div id="resultMeta" class="muted small" style="margin-top:12px"></div><div id="content"></div><div class="pager"><button id="prev">Назад</button><span id="pageInfo" class="muted"></span><button id="next">Дальше</button></div></section>
</main>
<div id="drawer" class="drawer hidden"><section class="drawer-card"><div class="drawer-head"><div><h2 id="drawerTitle"></h2><div id="drawerMeta" class="muted"></div></div><button id="drawerClose">Закрыть</button></div><div id="drawerBody"></div></section></div>
<div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id);let mode='entities',offset=0,total=0,limit=50,predicates=[],loadSequence=0,activeController=null,currentEntity=null;
const entityTypes=['winery','wine','wine_line','grape_variety','wine_region','geographic_place','terroir','aroma','flavor','food','dish','tradition','historical_event','person','organization','wine_route','tour','tasting','event','shop','product'];
const entityStatuses=['extracted','needs_review','verified','published','rejected'];
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='/admin/';throw new Error('Нужно войти в Admin')}if(!r.ok)throw new Error(d.message||d.error||'Ошибка запроса');return d}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function badge(s){return `<span class="badge ${esc(s)}">${esc(s)}</span>`}
function valueOf(f){return f.object_name??f.text_value??(f.number_value!=null?`${f.number_value}${f.unit?' '+f.unit:''}`:null)??f.date_value??'—'}
function toast(message,isError=false){const el=$('toast');el.textContent=message;el.style.background=isError?'#8e2337':'#241815';el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2600)}
async function loadOverview(){try{const {overview:o}=await api('/api/admin/knowledge-studio/overview');$('overview').innerHTML=[['Документы',o.documents],['Chunks',o.chunks],['Сущности',o.entities],['Факты',o.facts],['Без фактов',o.entities_without_facts],['Проверено',o.verified],['Опубликовано',o.published],['Требует проверки',o.needs_review],['Без источника',o.facts_without_source],['Wine.md товары',o.catalog_products]].map(([a,b])=>`<div class="card"><span>${a}</span><b>${b??0}</b></div>`).join('');const types=o.entity_types||[];$('types').innerHTML=types.map(t=>`<button class="chip" data-type="${esc(t.entity_type)}">${esc(t.entity_type)} · ${t.count}</button>`).join('');$('typeFilter').innerHTML='<option value="">Все типы</option>'+types.map(t=>`<option value="${esc(t.entity_type)}">${esc(t.entity_type)} (${t.count})</option>`).join('');document.querySelectorAll('#types [data-type]').forEach(button=>button.onclick=()=>filterType(button.dataset.type));syncTypeChips()}catch(e){$('overviewError').textContent=e.message}}
async function loadPredicates(){const d=await api('/api/admin/knowledge-studio/predicates');predicates=d.predicates||[];$('predicateFilter').innerHTML='<option value="">Все связи</option>'+predicates.map(p=>`<option value="${esc(p.predicate)}">${esc(p.label_ru)} (${esc(p.predicate)})</option>`).join('')}
function syncTypeChips(){document.querySelectorAll('#types [data-type]').forEach(b=>b.classList.toggle('active',mode==='entities'&&b.dataset.type===$('typeFilter').value))}
function setMode(next,{loadNow=true}={}){mode=next;offset=0;['Entities','Facts','Review'].forEach(x=>$('tab'+x).classList.toggle('active',x.toLowerCase()===next));$('typeFilter').classList.toggle('hidden',mode!=='entities');$('predicateFilter').classList.toggle('hidden',mode==='entities');$('group').disabled=mode!=='entities';$('sort').innerHTML=mode==='entities'?'<option value="name">По имени</option><option value="type">По типу</option><option value="facts">По числу фактов</option><option value="sources">По источникам</option><option value="created">По дате создания</option><option value="updated">По дате изменения</option><option value="status">По статусу</option>':'<option value="updated">По дате изменения</option><option value="created">По дате создания</option><option value="confidence">По уверенности</option><option value="subject">По субъекту</option><option value="predicate">По связи</option><option value="sources">По источникам</option><option value="status">По статусу</option>';syncTypeChips();if(loadNow)load()}
function filterType(type){setMode('entities',{loadNow:false});$('typeFilter').value=type;offset=0;syncTypeChips();load()}
function entityRows(items){return items.map(e=>`<tr><td><span class="name" data-id="${esc(e.id)}">${esc(e.canonical_name)}</span><div class="muted small">${esc(e.short_description||'')}</div></td><td>${esc(e.entity_type)}</td><td>${esc((e.aliases||[]).slice(0,4).join(', '))}</td><td><b>${e.fact_count}</b></td><td>${e.source_count}<div class="muted small">доказательств: ${e.evidence_count}</div></td><td>${new Date(e.updated_at).toLocaleDateString('ru-RU')}</td><td>${badge(e.status)}</td></tr>`).join('')}
function entitiesTable(items){return `<table class="table"><thead><tr><th>Название</th><th>Тип</th><th>Алиасы</th><th>Факты</th><th>Источники</th><th>Изменено</th><th>Статус</th></tr></thead><tbody>${entityRows(items)}</tbody></table>`}
async function load(){const sequence=++loadSequence;if(activeController)activeController.abort();activeController=new AbortController();const snapshot={mode,type:$('typeFilter').value,status:$('statusFilter').value,predicate:$('predicateFilter').value,query:$('search').value.trim(),sort:$('sort').value,order:$('order').value,offset};$('content').innerHTML='<div class="empty">Загрузка…</div>';$('apply').disabled=true;try{let d;if(snapshot.mode==='entities'){d=await api(`/api/admin/knowledge-studio/entities?query=${encodeURIComponent(snapshot.query)}&type=${encodeURIComponent(snapshot.type)}&status=${encodeURIComponent(snapshot.status)}&sort=${encodeURIComponent(snapshot.sort)}&order=${encodeURIComponent(snapshot.order)}&limit=${limit}&offset=${snapshot.offset}`,{signal:activeController.signal})}else{d=await api(`/api/admin/knowledge-studio/facts?query=${encodeURIComponent(snapshot.query)}&predicate=${encodeURIComponent(snapshot.predicate)}&status=${encodeURIComponent(snapshot.status)}&needsReview=${snapshot.mode==='review'}&sort=${encodeURIComponent(snapshot.sort)}&order=${encodeURIComponent(snapshot.order)}&limit=${limit}&offset=${snapshot.offset}`,{signal:activeController.signal})}if(sequence!==loadSequence)return;total=d.total;if(snapshot.mode==='entities'){if($('group').checked){const groups=d.items.reduce((acc,item)=>((acc[item.entity_type]??=[]).push(item),acc),{});$('content').innerHTML=Object.entries(groups).map(([type,items])=>`<h3 class="typehead">${esc(type)} · ${items.length}</h3>${entitiesTable(items)}`).join('')||'<div class="empty">Ничего не найдено.</div>'}else $('content').innerHTML=d.items.length?entitiesTable(d.items):'<div class="empty">Ничего не найдено.</div>';document.querySelectorAll('.name').forEach(x=>x.onclick=()=>openEntity(x.dataset.id))}else{$('content').innerHTML=d.items.length?`<table class="table"><thead><tr><th>Факт</th><th>Уверенность</th><th>Источники</th><th>Создан</th><th>Статус</th><th></th></tr></thead><tbody>${d.items.map(f=>`<tr><td><span class="factlink" data-id="${esc(f.id)}">${esc(f.subject_name)} · ${esc(f.label_ru||f.predicate)} · ${esc(valueOf(f))}</span><div class="muted small">${esc(f.predicate)}</div></td><td>${Math.round(Number(f.confidence||0)*100)}%</td><td>${f.source_count}</td><td>${new Date(f.created_at).toLocaleDateString('ru-RU')}</td><td>${badge(f.status)}</td><td><div class="actions"><button onclick="review('${esc(f.id)}','verify')">Подтвердить</button><button onclick="review('${esc(f.id)}','publish')">Опубликовать</button><button class="danger" onclick="review('${esc(f.id)}','reject')">Отклонить</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Ничего не найдено.</div>';document.querySelectorAll('.factlink').forEach(x=>x.onclick=()=>openFact(x.dataset.id))}$('resultMeta').textContent=`Найдено: ${total}`;$('pageInfo').textContent=`${total?snapshot.offset+1:0}–${Math.min(snapshot.offset+limit,total)} из ${total}`;$('prev').disabled=snapshot.offset===0;$('next').disabled=snapshot.offset+limit>=total}catch(e){if(e.name!=='AbortError'&&sequence===loadSequence)$('content').innerHTML=`<div class="error">${esc(e.message)}</div>`}finally{if(sequence===loadSequence)$('apply').disabled=false}}
function renderAliases(aliases){return aliases.length?aliases.map(a=>`<div class="alias-row"><span><b>${esc(a.alias)}</b>${a.language?` <span class="muted small">${esc(a.language)}</span>`:''}</span><button class="danger alias-delete" data-id="${esc(a.id)}">Удалить</button></div>`).join(''):'<div class="muted">Алиасов пока нет.</div>'}
function renderEntity(entity,graph){currentEntity=entity;$('drawerTitle').textContent=entity.canonical_name;$('drawerMeta').innerHTML=`${esc(entity.entity_type)} · ${badge(entity.status)} · создано ${new Date(entity.created_at).toLocaleDateString('ru-RU')}`;$('drawerBody').innerHTML=`<div class="actions" style="margin-top:14px"><button class="primary" id="editEntityBtn">Редактировать</button><button id="historyBtn">История</button></div><div id="entityEditor" class="editor hidden"></div><h3>Алиасы</h3><div id="aliasesList">${renderAliases(entity.aliases||[])}</div><div class="form-actions"><input id="newAlias" placeholder="Новый алиас" style="flex:1"><input id="newAliasLanguage" placeholder="Язык, например ru" style="max-width:170px"><button id="addAliasBtn">Добавить алиас</button></div><h3>Описания</h3>${(entity.descriptions||[]).map(d=>`<div class="fact">${esc(d.description)}<div class="muted small">Документ: ${esc(d.documentId||'—')} · chunk: ${esc(d.chunkId||'—')}</div></div>`).join('')||'<p class="muted">Нет описаний.</p>'}<h3>Связи (${graph.edges.length})</h3><div class="graph">${graph.edges.map(e=>`<div class="edge"><b>${esc(e.label||e.predicate)}</b><div>${esc(e.value??e.to??'—')}</div><div class="muted small">${esc(e.status||'')}</div></div>`).join('')||'<div class="muted">Нет связей.</div>'}</div><h3>Факты (${(entity.facts||[]).length})</h3>${(entity.facts||[]).map(f=>`<div class="fact"><b>${esc(f.subject_name)} · ${esc(f.label_ru||f.predicate)} · ${esc(valueOf(f))}</b><div class="muted small">${esc(f.predicate)} · ${Math.round(Number(f.confidence||0)*100)}% · ${esc(f.status)}</div>${(f.sources||[]).map(s=>`<div class="quote">${esc(s.quote||s.chunkText||'Источник без цитаты')}<div class="muted small">${esc(s.documentTitle||s.url||'Источник')} ${s.pageNumber?'· стр. '+esc(s.pageNumber):''}</div></div>`).join('')}</div>`).join('')||'<p class="muted">Нет фактов.</p>'}`;$('editEntityBtn').onclick=()=>showEntityEditor(entity);$('addAliasBtn').onclick=addAlias;$('historyBtn').onclick=showHistory;bindAliasDelete();$('drawer').classList.remove('hidden')}
function bindAliasDelete(){document.querySelectorAll('.alias-delete').forEach(btn=>btn.onclick=async()=>{if(!confirm('Удалить этот алиас?'))return;btn.disabled=true;try{await api(`/api/admin/knowledge-studio/entities/${encodeURIComponent(currentEntity.id)}/aliases/${encodeURIComponent(btn.dataset.id)}`,{method:'DELETE'});toast('Алиас удалён');await refreshEntity()}catch(e){toast(e.message,true);btn.disabled=false}})}
function showEntityEditor(entity){const box=$('entityEditor');box.classList.remove('hidden');box.innerHTML=`<h3 style="margin-top:0">Редактирование сущности</h3><div class="form-grid"><div class="field"><label>Название</label><input id="editName" value="${esc(entity.canonical_name)}"></div><div class="field"><label>Тип</label><select id="editType">${entityTypes.map(t=>`<option ${t===entity.entity_type?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="field"><label>Статус</label><select id="editStatus">${entityStatuses.map(s=>`<option ${s===entity.status?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Комментарий</label><input id="editComment" placeholder="Почему изменили"></div></div><div class="field" style="margin-top:12px"><label>Краткое описание</label><textarea id="editDescription" rows="4">${esc(entity.short_description||'')}</textarea></div><div class="form-actions" style="margin-top:12px"><button class="primary" id="saveEntityBtn">Сохранить</button><button id="cancelEditBtn">Отмена</button></div><div id="editError" class="error"></div>`;$('saveEntityBtn').onclick=saveEntity;$('cancelEditBtn').onclick=()=>box.classList.add('hidden')}
async function saveEntity(){const btn=$('saveEntityBtn');btn.disabled=true;$('editError').textContent='';try{await api(`/api/admin/knowledge-studio/entities/${encodeURIComponent(currentEntity.id)}`,{method:'PUT',body:JSON.stringify({canonicalName:$('editName').value.trim(),entityType:$('editType').value,status:$('editStatus').value,shortDescription:$('editDescription').value.trim(),comment:$('editComment').value.trim()})});toast('Сущность сохранена');await refreshEntity();await Promise.all([load(),loadOverview()])}catch(e){$('editError').textContent=e.message;btn.disabled=false}}
async function addAlias(){const alias=$('newAlias').value.trim();if(!alias)return toast('Введите алиас',true);const btn=$('addAliasBtn');btn.disabled=true;try{await api(`/api/admin/knowledge-studio/entities/${encodeURIComponent(currentEntity.id)}/aliases`,{method:'POST',body:JSON.stringify({alias,language:$('newAliasLanguage').value.trim()||null})});toast('Алиас добавлен');await refreshEntity()}catch(e){toast(e.message,true);btn.disabled=false}}
async function showHistory(){const btn=$('historyBtn');btn.disabled=true;try{const d=await api(`/api/admin/knowledge-studio/entities/${encodeURIComponent(currentEntity.id)}/history`);const rows=d.history||[];$('entityEditor').classList.remove('hidden');$('entityEditor').innerHTML=`<h3 style="margin-top:0">История изменений</h3>${rows.length?rows.map(h=>`<div class="history-item"><b>${esc(h.action)}</b><div class="muted small">${esc(h.actor||'admin')} · ${new Date(h.created_at).toLocaleString('ru-RU')}</div>${h.comment?`<p>${esc(h.comment)}</p>`:''}</div>`).join(''):'<div class="muted">История пока пуста.</div>'}`}catch(e){toast(e.message,true)}finally{btn.disabled=false}}
async function refreshEntity(){const id=currentEntity.id;const [{entity},{graph}]=await Promise.all([api('/api/admin/knowledge-studio/entities/'+encodeURIComponent(id)),api('/api/admin/knowledge-studio/entities/'+encodeURIComponent(id)+'/graph')]);renderEntity(entity,graph)}
async function openEntity(id){try{const [{entity},{graph}]=await Promise.all([api('/api/admin/knowledge-studio/entities/'+encodeURIComponent(id)),api('/api/admin/knowledge-studio/entities/'+encodeURIComponent(id)+'/graph')]);renderEntity(entity,graph)}catch(e){toast(e.message,true)}}
async function openFact(id){try{const {fact}=await api('/api/admin/knowledge-studio/facts/'+encodeURIComponent(id));$('drawerTitle').textContent='Факт';$('drawerMeta').innerHTML=`${esc(fact.subject_name)} · ${badge(fact.status)}`;$('drawerBody').innerHTML=`<div class="fact"><b>${esc(fact.subject_name)} · ${esc(fact.label_ru||fact.predicate)} · ${esc(valueOf(fact))}</b><div class="muted small">${esc(fact.predicate)} · ${Math.round(Number(fact.confidence||0)*100)}%</div>${(fact.sources||[]).map(s=>`<div class="quote">${esc(s.quote||s.chunkText||'Источник без цитаты')}<div class="muted small">${esc(s.documentTitle||s.url||'Источник')} ${s.pageNumber?'· стр. '+esc(s.pageNumber):''}</div></div>`).join('')}</div>`;$('drawer').classList.remove('hidden')}catch(e){toast(e.message,true)}}
async function review(id,action){try{await api(`/api/admin/knowledge-studio/facts/${encodeURIComponent(id)}/review`,{method:'POST',body:JSON.stringify({action})});toast('Статус факта обновлён');await Promise.all([load(),loadOverview()])}catch(e){toast(e.message,true)}}
$('tabEntities').onclick=()=>setMode('entities');$('tabFacts').onclick=()=>setMode('facts');$('tabReview').onclick=()=>setMode('review');$('apply').onclick=()=>{offset=0;load()};$('refresh').onclick=()=>Promise.all([load(),loadOverview(),loadPredicates()]);$('prev').onclick=()=>{offset=Math.max(0,offset-limit);load()};$('next').onclick=()=>{offset+=limit;load()};$('drawerClose').onclick=()=>$('drawer').classList.add('hidden');$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').classList.add('hidden')};$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){offset=0;load()}});$('typeFilter').onchange=()=>{offset=0;syncTypeChips();load()};$('statusFilter').onchange=()=>{offset=0;load()};$('predicateFilter').onchange=()=>{offset=0;load()};$('sort').onchange=()=>{offset=0;load()};$('order').onchange=()=>{offset=0;load()};
Promise.all([loadOverview(),loadPredicates()]).then(load).catch(e=>toast(e.message,true));
</script>
</body>
</html>
