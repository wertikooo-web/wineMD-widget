<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knowledge Studio · Wine.md</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#241815;background:#f5f2ef}*{box-sizing:border-box}body{margin:0}.shell{max-width:1380px;margin:22px auto;padding:0 18px}.top,.tabs,.filters,.actions,.pager,.chips{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between;align-items:flex-start}.panel{background:#fff;border:1px solid #e4d9d3;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 10px 30px rgba(60,25,34,.06)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.card,.group{border:1px solid #e6dcd7;border-radius:14px;padding:14px}.card b{display:block;font-size:24px;margin-top:4px}.muted{color:#756862}.small{font-size:13px}button,input,select{font:inherit;border:1px solid #cfc3bd;border-radius:9px;padding:10px;background:#fff}button{font-weight:750;cursor:pointer}button.primary,.tabs .active{background:#6e1634;color:#fff;border-color:#6e1634}button.danger{background:#8e2337;color:#fff;border-color:#8e2337}input{min-width:260px;flex:1}.filters{margin-top:14px}.table{width:100%;border-collapse:collapse;margin-top:14px}.table th,.table td{padding:11px 9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.table th{font-size:12px;text-transform:uppercase;color:#746761;white-space:nowrap}.name,.factlink{font-weight:800;color:#5b1b35;cursor:pointer}.badge,.chip{display:inline-block;padding:4px 9px;border-radius:999px;background:#eee7e3;font-size:12px;font-weight:700}.badge.verified,.badge.published{background:#e4f2e8;color:#24683d}.badge.needs_review{background:#fff0c9;color:#7a5900}.badge.rejected{background:#f7e5e8;color:#8e2337}.hidden{display:none!important}.pager{justify-content:space-between;margin-top:14px}.drawer{position:fixed;inset:0;background:rgba(31,20,18,.42);display:flex;justify-content:flex-end;z-index:20}.drawer-card{width:min(780px,100%);height:100%;overflow:auto;background:#fff;padding:24px}.drawer-head{display:flex;justify-content:space-between;gap:12px}.fact{border:1px solid #e5dcd7;border-radius:12px;padding:14px;margin:10px 0}.quote{background:#faf7f5;border-left:3px solid #b98f9e;padding:10px;margin-top:8px;white-space:pre-wrap}.graph{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.edge{border:1px solid #eadfda;border-radius:10px;padding:10px}.error{color:#9c1c2f}.empty{padding:28px;text-align:center;color:#756862}.typehead{margin:20px 0 6px;padding-bottom:7px;border-bottom:2px solid #eadfda}@media(max-width:780px){.table{display:block;overflow:auto}.filters>*{width:100%}.drawer-card{width:100%}}
</style></head><body><main class="shell">
<div class="top"><div><h1 style="margin:0">Knowledge Studio</h1><div class="muted">Проверка сущностей, фактов, связей и источников.</div></div><div class="actions"><button onclick="location.href='/admin/'">Назад в Admin</button><button id="refresh" class="primary">Обновить</button></div></div>
<section class="panel"><div id="overview" class="cards"></div><div id="types" class="chips" style="margin-top:14px"></div><div id="overviewError" class="error"></div></section>
<section class="panel"><div class="tabs"><button id="tabEntities" class="active">Сущности</button><button id="tabFacts">Факты</button><button id="tabReview">Требует проверки</button></div>
<div class="filters"><input id="search" placeholder="Поиск по названию, алиасам, описанию и значениям"><select id="typeFilter"><option value="">Все типы</option></select><select id="statusFilter"><option value="">Все статусы</option><option>extracted</option><option>needs_review</option><option>verified</option><option>published</option><option>rejected</option></select><select id="predicateFilter" class="hidden"><option value="">Все связи</option></select><select id="sort"><option value="name">По имени</option><option value="type">По типу</option><option value="facts">По числу фактов</option><option value="sources">По источникам</option><option value="created">По дате создания</option><option value="updated">По дате изменения</option><option value="status">По статусу</option></select><select id="order"><option value="asc">По возрастанию</option><option value="desc">По убыванию</option></select><label class="chip"><input id="group" type="checkbox"> Группировать</label><button id="apply" class="primary">Найти</button></div>
<div id="resultMeta" class="muted small" style="margin-top:12px"></div><div id="content"></div><div class="pager"><button id="prev">Назад</button><span id="pageInfo" class="muted"></span><button id="next">Дальше</button></div></section></main>
<div id="drawer" class="drawer hidden"><section class="drawer-card"><div class="drawer-head"><div><h2 id="drawerTitle"></h2><div id="drawerMeta" class="muted"></div></div><button id="drawerClose">Закрыть</button></div><div id="drawerBody"></div></section></div>
<script>
const $=id=>document.getElementById(id);let mode='entities',offset=0,total=0,limit=50,predicates=[];
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='/admin/';throw new Error('Нужно войти в Admin')}if(!r.ok)throw new Error(d.message||d.error||'Ошибка запроса');return d}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function badge(s){return `<span class="badge ${esc(s)}">${esc(s)}</span>`}function valueOf(f){return f.object_name??f.text_value??(f.number_value!=null?`${f.number_value}${f.unit?' '+f.unit:''}`:null)??f.date_value??'—'}
async function loadOverview(){try{const {overview:o}=await api('/api/admin/knowledge-studio/overview');$('overview').innerHTML=[['Документы',o.documents],['Chunks',o.chunks],['Сущности',o.entities],['Факты',o.facts],['Без фактов',o.entities_without_facts],['Проверено',o.verified],['Опубликовано',o.published],['Требует проверки',o.needs_review],['Без источника',o.facts_without_source],['Wine.md товары',o.catalog_products]].map(([a,b])=>`<div class="card"><span>${a}</span><b>${b??0}</b></div>`).join('');$('types').innerHTML=(o.entity_types||[]).map(t=>`<button class="chip" onclick="filterType('${esc(t.entity_type)}')">${esc(t.entity_type)} · ${t.count}</button>`).join('');const types=o.entity_types||[];$('typeFilter').innerHTML='<option value="">Все типы</option>'+types.map(t=>`<option value="${esc(t.entity_type)}">${esc(t.entity_type)} (${t.count})</option>`).join('')}catch(e){$('overviewError').textContent=e.message}}
async function loadPredicates(){const d=await api('/api/admin/knowledge-studio/predicates');predicates=d.predicates||[];$('predicateFilter').innerHTML='<option value="">Все связи</option>'+predicates.map(p=>`<option value="${esc(p.predicate)}">${esc(p.label_ru)} (${esc(p.predicate)})</option>`).join('')}
function filterType(t){switchMode('entities');$('typeFilter').value=t;offset=0;load()}
function entityRows(items){return items.map(e=>`<tr><td><span class="name" data-id="${esc(e.id)}">${esc(e.canonical_name)}</span><div class="muted small">${esc(e.short_description||'')}</div></td><td>${esc(e.entity_type)}</td><td>${esc((e.aliases||[]).slice(0,4).join(', '))}</td><td><b>${e.fact_count}</b></td><td>${e.source_count}<div class="muted small">доказательств: ${e.evidence_count}</div></td><td>${new Date(e.updated_at).toLocaleDateString('ru-RU')}</td><td>${badge(e.status)}</td></tr>`).join('')}
function entitiesTable(items){return `<table class="table"><thead><tr><th>Название</th><th>Тип</th><th>Алиасы</th><th>Факты</th><th>Источники</th><th>Изменено</th><th>Статус</th></tr></thead><tbody>${entityRows(items)}</tbody></table>`}
async function load(){const q=encodeURIComponent($('search').value.trim()),sort=encodeURIComponent($('sort').value),order=encodeURIComponent($('order').value);$('content').innerHTML='<div class="empty">Загрузка…</div>';try{if(mode==='entities'){const type=encodeURIComponent($('typeFilter').value),status=encodeURIComponent($('statusFilter').value);const d=await api(`/api/admin/knowledge-studio/entities?query=${q}&type=${type}&status=${status}&sort=${sort}&order=${order}&limit=${limit}&offset=${offset}`);total=d.total;if($('group').checked){const groups=Object.groupBy(d.items,e=>e.entity_type);$('content').innerHTML=Object.entries(groups).map(([type,items])=>`<h3 class="typehead">${esc(type)} · ${items.length}</h3>${entitiesTable(items)}`).join('')||'<div class="empty">Ничего не найдено.</div>'}else $('content').innerHTML=d.items.length?entitiesTable(d.items):'<div class="empty">Ничего не найдено.</div>';document.querySelectorAll('.name').forEach(x=>x.onclick=()=>openEntity(x.dataset.id));}else{const predicate=encodeURIComponent($('predicateFilter').value),status=encodeURIComponent($('statusFilter').value);const d=await api(`/api/admin/knowledge-studio/facts?query=${q}&predicate=${predicate}&status=${status}&needsReview=${mode==='review'}&sort=${sort}&order=${order}&limit=${limit}&offset=${offset}`);total=d.total;$('content').innerHTML=d.items.length?`<table class="table"><thead><tr><th>Факт</th><th>Уверенность</th><th>Источники</th><th>Создан</th><th>Статус</th><th></th></tr></thead><tbody>${d.items.map(f=>`<tr><td><span class="factlink" data-id="${esc(f.id)}">${esc(f.subject_name)} · ${esc(f.label_ru||f.predicate)} · ${esc(valueOf(f))}</span><div class="muted small">${esc(f.predicate)}</div></td><td>${Math.round(Number(f.confidence||0)*100)}%</td><td>${f.source_count}</td><td>${new Date(f.created_at).toLocaleDateString('ru-RU')}</td><td>${badge(f.status)}</td><td><div class="actions"><button onclick="review('${esc(f.id)}','verify')">Подтвердить</button><button onclick="review('${esc(f.id)}','publish')">Опубликовать</button><button class="danger" onclick="review('${esc(f.id)}','reject')">Отклонить</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Ничего не найдено.</div>';document.querySelectorAll('.factlink').forEach(x=>x.onclick=()=>openFact(x.dataset.id))}$('resultMeta').textContent=`Найдено: ${total}`;$('pageInfo').textContent=`${total?offset+1:0}–${Math.min(offset+limit,total)} из ${total}`;$('prev').disabled=offset===0;$('next').disabled=offset+limit>=total}catch(e){$('content').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function openEntity(id){const [{entity},{graph}]=await Promise.all([api('/api/admin/knowledge-studio/entities/'+encodeURIComponent(id)),api('/api/admin/knowledge-studio/entities/'+encodeURIComponent(id)+'/graph')]);$('drawerTitle').textContent=entity.canonical_name;$('drawerMeta').textContent=`${entity.entity_type} · ${entity.status} · создано ${new Date(entity.created_at).toLocaleDateString('ru-RU')}`;$('drawerBody').innerHTML=`<h3>Алиасы</h3><p>${esc((entity.aliases||[]).map(a=>a.alias).join(', ')||'Нет')}</p><h3>Описания</h3>${(entity.descriptions||[]).map(d=>`<div class="fact">${esc(d.description)}<div class="muted small">Документ: ${esc(d.documentId||'—')} · chunk: ${esc(d.chunkId||'—')}</div></div>`).join('')||'<p class="muted">Нет описаний.</p>'}<h3>Связи (${graph.edges.length})</h3><div class="graph">${graph.edges.map(e=>`<div class="edge"><b>${esc(e.label||e.predicate)}</b><div>${esc((graph.nodes.find(n=>n.id===e.from)||{}).name||e.from)} → ${esc((graph.nodes.find(n=>n.id===e.to)||{}).name||e.value||'значение')}</div></div>`).join('')||'<div class="muted">Связей нет.</div>'}</div><h3>Факты и источники</h3>${(entity.facts||[]).map(f=>`<div class="fact"><div class="factlink" onclick="openFact('${esc(f.id)}')">${esc(f.subject_name)} · ${esc(f.label_ru||f.predicate)} · ${esc(valueOf(f))}</div><div class="muted small">${Math.round(Number(f.confidence||0)*100)}% · ${esc(f.status)}</div>${(f.sources||[]).map(s=>`<div class="quote"><b>${esc(s.documentTitle||'Источник')}</b>${s.pageNumber?' · стр. '+esc(s.pageNumber):''}<br>${esc(s.quote||s.chunkText||'Цитата отсутствует')}</div>`).join('')}</div>`).join('')||'<p class="muted">Нет фактов.</p>'}`;$('drawer').classList.remove('hidden')}
async function openFact(id){const {fact}=await api('/api/admin/knowledge-studio/facts/'+encodeURIComponent(id));$('drawerTitle').textContent=`${fact.subject_name} · ${fact.label_ru||fact.predicate}`;$('drawerMeta').textContent=`${fact.status} · уверенность ${Math.round(Number(fact.confidence||0)*100)}%`;$('drawerBody').innerHTML=`<div class="fact"><b>Значение:</b> ${esc(valueOf(fact))}<br><b>Связь:</b> ${esc(fact.predicate)}</div><h3>Откуда взято</h3>${(fact.sources||[]).map(s=>`<div class="quote"><b>${esc(s.documentTitle||s.documentId||'Источник')}</b>${s.pageNumber?' · страница '+esc(s.pageNumber):''}<div class="muted small">chunk: ${esc(s.chunkId||'—')}</div><br>${esc(s.quote||s.chunkText||'Текст источника не сохранён')}</div>`).join('')||'<p class="error">Источник не привязан. Факт требует проверки.</p>'}`;$('drawer').classList.remove('hidden')}
async function review(id,action){const comment=prompt('Комментарий к действию:','')??'';await api(`/api/admin/knowledge-studio/facts/${encodeURIComponent(id)}/review`,{method:'POST',body:JSON.stringify({action,comment})});await Promise.all([load(),loadOverview()])}
function switchMode(next){mode=next;offset=0;['Entities','Facts','Review'].forEach(x=>$('tab'+x).classList.toggle('active',x.toLowerCase()===next));$('typeFilter').classList.toggle('hidden',mode!=='entities');$('predicateFilter').classList.toggle('hidden',mode==='entities');$('group').disabled=mode!=='entities';$('sort').innerHTML=mode==='entities'?'<option value="name">По имени</option><option value="type">По типу</option><option value="facts">По числу фактов</option><option value="sources">По источникам</option><option value="created">По дате создания</option><option value="updated">По дате изменения</option><option value="status">По статусу</option>':'<option value="updated">По дате изменения</option><option value="created">По дате создания</option><option value="confidence">По уверенности</option><option value="subject">По субъекту</option><option value="predicate">По связи</option><option value="sources">По источникам</option><option value="status">По статусу</option>';load()}
$('tabEntities').onclick=()=>switchMode('entities');$('tabFacts').onclick=()=>switchMode('facts');$('tabReview').onclick=()=>switchMode('review');$('apply').onclick=()=>{offset=0;load()};$('search').onkeydown=e=>{if(e.key==='Enter')$('apply').click()};$('prev').onclick=()=>{offset=Math.max(0,offset-limit);load()};$('next').onclick=()=>{offset+=limit;load()};$('refresh').onclick=()=>Promise.all([loadOverview(),load()]);$('drawerClose').onclick=()=>$('drawer').classList.add('hidden');$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').classList.add('hidden')};
(async()=>{await Promise.all([loadOverview(),loadPredicates()]);await load()})();
</script></body></html>
