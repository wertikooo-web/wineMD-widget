<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Редактор фактов · Wine.md</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#241815;background:#f5f2ef}*{box-sizing:border-box}body{margin:0}.shell{max-width:1280px;margin:22px auto;padding:0 18px}.top,.filters,.actions,.pager,.source-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.panel{background:#fff;border:1px solid #e4d9d3;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 10px 30px rgba(60,25,34,.06)}button,input,select,textarea{font:inherit;border:1px solid #cfc3bd;border-radius:9px;padding:10px;background:#fff}button{font-weight:750;cursor:pointer}button.primary{background:#6e1634;color:#fff;border-color:#6e1634}button.danger{background:#8e2337;color:#fff;border-color:#8e2337}button:disabled{opacity:.55;cursor:wait}input,textarea{width:100%}.filters input{min-width:280px;flex:1}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.table th{font-size:12px;text-transform:uppercase;color:#746761}.link{font-weight:800;color:#5b1b35;cursor:pointer}.muted{color:#756862}.small{font-size:13px}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#eee7e3;font-size:12px;font-weight:700}.badge.verified,.badge.published{background:#e4f2e8;color:#24683d}.badge.needs_review{background:#fff0c9;color:#7a5900}.badge.rejected{background:#f7e5e8;color:#8e2337}.drawer{position:fixed;inset:0;background:rgba(31,20,18,.42);display:flex;justify-content:flex-end;z-index:20}.drawer.hidden{display:none}.drawer-card{width:min(860px,100%);height:100%;overflow:auto;background:#fff;padding:24px}.drawer-head{display:flex;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;color:#746761;margin-bottom:6px}.editor,.source{border:1px solid #e5dcd7;border-radius:14px;padding:16px;margin:14px 0}.quote{background:#faf7f5;border-left:3px solid #b98f9e;padding:10px;margin-top:8px;white-space:pre-wrap}.error{color:#9c1c2f}.toast{position:fixed;right:22px;bottom:22px;background:#241815;color:#fff;padding:12px 16px;border-radius:10px;z-index:50}.hidden{display:none!important}.pager{justify-content:space-between}.entity-results{max-height:220px;overflow:auto;border:1px solid #e5dcd7;border-radius:10px;margin-top:8px}.entity-result{padding:9px;border-bottom:1px solid #eee;cursor:pointer}.entity-result:hover{background:#faf7f5}@media(max-width:760px){.grid{grid-template-columns:1fr}.table{display:block;overflow:auto}.drawer-card{width:100%}}
</style>
</head>
<body>
<main class="shell">
<div class="top"><div><h1 style="margin:0">Редактор фактов</h1><div class="muted">Правка связей, значений, статусов и проверка источников.</div></div><div class="actions"><button onclick="location.href='/admin/knowledge-studio.html'">Knowledge Studio</button><button onclick="location.href='/admin/'">Admin</button></div></div>
<section class="panel"><div class="filters"><input id="search" placeholder="Поиск по сущности, значению или связи"><select id="status"><option value="">Все статусы</option><option>extracted</option><option>needs_review</option><option>verified</option><option>published</option><option>rejected</option></select><select id="predicate"><option value="">Все связи</option></select><button id="find" class="primary">Найти</button></div></section>
<section class="panel"><div id="meta" class="muted small"></div><div id="content"></div><div class="pager"><button id="prev">Назад</button><span id="page"></span><button id="next">Дальше</button></div></section>
</main>
<div id="drawer" class="drawer hidden"><section class="drawer-card"><div class="drawer-head"><div><h2 id="title"></h2><div id="subtitle" class="muted"></div></div><button id="close">Закрыть</button></div><div id="body"></div></section></div>
<div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id);let offset=0,total=0,limit=40,predicates=[],fact=null,selectedEntity=null;
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='/admin/';throw new Error('Нужно войти в Admin')}if(!r.ok)throw new Error(d.message||d.error||'Ошибка запроса');return d}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function badge(s){return `<span class="badge ${esc(s)}">${esc(s)}</span>`}
function valueOf(f){return f.object_name??f.text_value??(f.number_value!=null?`${f.number_value}${f.unit?' '+f.unit:''}`:null)??f.date_value??'—'}
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}
async function loadPredicates(){const d=await api('/api/admin/knowledge-studio/predicates');predicates=d.predicates||[];$('predicate').innerHTML='<option value="">Все связи</option>'+predicates.map(p=>`<option value="${esc(p.predicate)}">${esc(p.label_ru)} (${esc(p.predicate)})</option>`).join('')}
async function load(){ $('content').innerHTML='<p class="muted">Загрузка…</p>';const q=$('search').value.trim(),status=$('status').value,predicate=$('predicate').value;try{const d=await api(`/api/admin/knowledge-studio/facts?query=${encodeURIComponent(q)}&status=${encodeURIComponent(status)}&predicate=${encodeURIComponent(predicate)}&sort=updated&order=desc&limit=${limit}&offset=${offset}`);total=d.total;$('meta').textContent=`Найдено: ${total}`;$('page').textContent=`${total?offset+1:0}–${Math.min(offset+limit,total)} из ${total}`;$('prev').disabled=offset===0;$('next').disabled=offset+limit>=total;$('content').innerHTML=d.items.length?`<table class="table"><thead><tr><th>Факт</th><th>Уверенность</th><th>Источники</th><th>Статус</th></tr></thead><tbody>${d.items.map(f=>`<tr><td><span class="link" data-id="${esc(f.id)}">${esc(f.subject_name)} · ${esc(f.label_ru||f.predicate)} · ${esc(valueOf(f))}</span><div class="muted small">${esc(f.predicate)}</div></td><td>${Math.round(Number(f.confidence||0)*100)}%</td><td>${f.source_count}</td><td>${badge(f.status)}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Ничего не найдено.</p>';document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>openFact(x.dataset.id))}catch(e){$('content').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function modeFor(f){if(f.object_entity_id)return'entity';if(f.number_value!=null)return'number';if(f.date_value)return'date';return'text'}
async function openFact(id){const d=await api('/api/admin/knowledge-studio/facts/'+encodeURIComponent(id));fact=d.fact;selectedEntity=fact.object_entity_id?{id:fact.object_entity_id,name:fact.object_name}:null;$('title').textContent=fact.subject_name;$('subtitle').innerHTML=`${esc(fact.label_ru||fact.predicate)} · ${badge(fact.status)} · уверенность ${Math.round(Number(fact.confidence||0)*100)}%`;$('body').innerHTML=editorHtml(fact);$('drawer').classList.remove('hidden');bindEditor()}
function editorHtml(f){const mode=modeFor(f);return `<div class="editor"><div class="grid"><div class="field"><label>Связь</label><select id="editPredicate">${predicates.map(p=>`<option value="${esc(p.predicate)}" ${p.predicate===f.predicate?'selected':''}>${esc(p.label_ru)} (${esc(p.predicate)})</option>`).join('')}</select></div><div class="field"><label>Тип значения</label><select id="valueMode"><option value="entity" ${mode==='entity'?'selected':''}>Сущность</option><option value="text" ${mode==='text'?'selected':''}>Текст</option><option value="number" ${mode==='number'?'selected':''}>Число</option><option value="date" ${mode==='date'?'selected':''}>Дата</option></select></div></div><div id="valueEditor" style="margin-top:12px"></div><div class="field" style="margin-top:12px"><label>Комментарий к правке</label><textarea id="comment" rows="3" placeholder="Что и почему исправлено"></textarea></div><div class="actions" style="margin-top:12px"><button id="save" class="primary">Сохранить и подтвердить</button><button id="verify">Подтвердить</button><button id="publish">Опубликовать</button><button id="reject" class="danger">Отклонить</button></div><div id="editorError" class="error"></div></div><h3>Источники (${(f.sources||[]).length})</h3>${(f.sources||[]).map(s=>`<div class="source"><div class="source-head"><b>${esc(s.documentTitle||'Источник')}</b><span class="muted small">страница ${esc(s.pageNumber||'—')} · chunk ${esc(s.chunkId||'—')}</span></div>${s.quote?`<div class="quote">${esc(s.quote)}</div>`:''}${s.chunkText?`<details><summary>Контекст чанка</summary><div class="quote">${esc(s.chunkText)}</div></details>`:''}${s.url?`<div class="small"><a href="${esc(s.url)}" target="_blank" rel="noopener">Открыть источник</a></div>`:''}</div>`).join('')||'<p class="muted">Источники не привязаны.</p>'}`}
function bindEditor(){$('valueMode').onchange=renderValueEditor;renderValueEditor();$('save').onclick=saveFact;$('verify').onclick=()=>review('verify');$('publish').onclick=()=>review('publish');$('reject').onclick=()=>review('reject')}
function renderValueEditor(){const mode=$('valueMode').value,box=$('valueEditor');if(mode==='entity'){box.innerHTML=`<div class="field"><label>Объект-сущность</label><input id="entitySearch" value="${esc(selectedEntity?.name||'')}" placeholder="Начните вводить название"><input id="entityId" type="hidden" value="${esc(selectedEntity?.id||'')}"><div id="entityResults" class="entity-results hidden"></div></div>`;let timer;$('entitySearch').oninput=()=>{selectedEntity=null;$('entityId').value='';clearTimeout(timer);timer=setTimeout(searchEntities,250)}}else if(mode==='text'){box.innerHTML=`<div class="field"><label>Текстовое значение</label><textarea id="textValue" rows="4">${esc(fact.text_value||'')}</textarea></div>`}else if(mode==='number'){box.innerHTML=`<div class="grid"><div class="field"><label>Число</label><input id="numberValue" type="number" step="any" value="${esc(fact.number_value??'')}"></div><div class="field"><label>Единица</label><input id="unit" value="${esc(fact.unit||'')}"></div></div>`}else{box.innerHTML=`<div class="field"><label>Дата</label><input id="dateValue" type="date" value="${esc(fact.date_value||'')}"></div>`}}
async function searchEntities(){const q=$('entitySearch').value.trim(),box=$('entityResults');if(q.length<2){box.classList.add('hidden');return}const d=await api(`/api/admin/knowledge-studio/entities?query=${encodeURIComponent(q)}&sort=name&order=asc&limit=20&offset=0`);box.innerHTML=d.items.map(e=>`<div class="entity-result" data-entity-id="${esc(e.id)}" data-entity-name="${esc(e.canonical_name)}"><b>${esc(e.canonical_name)}</b><div class="muted small">${esc(e.entity_type)}</div></div>`).join('')||'<div class="entity-result muted">Ничего не найдено</div>';box.classList.remove('hidden');box.querySelectorAll('[data-entity-id]').forEach(x=>x.onclick=()=>{selectedEntity={id:x.dataset.entityId,name:x.dataset.entityName};$('entitySearch').value=selectedEntity.name;$('entityId').value=selectedEntity.id;box.classList.add('hidden')})}
async function saveFact(){const mode=$('valueMode').value,payload={predicate:$('editPredicate').value,objectEntityId:null,textValue:null,numberValue:null,dateValue:null,unit:null,comment:$('comment').value.trim()};if(mode==='entity'){payload.objectEntityId=$('entityId').value||null;if(!payload.objectEntityId)return showError('Выберите сущность из списка.')}if(mode==='text'){payload.textValue=$('textValue').value.trim()||null;if(!payload.textValue)return showError('Введите текстовое значение.')}if(mode==='number'){const raw=$('numberValue').value;if(raw==='')return showError('Введите число.');payload.numberValue=Number(raw);payload.unit=$('unit').value.trim()||null}if(mode==='date'){payload.dateValue=$('dateValue').value||null;if(!payload.dateValue)return showError('Выберите дату.')}try{$('save').disabled=true;await api('/api/admin/knowledge-studio/facts/'+encodeURIComponent(fact.id),{method:'PUT',body:JSON.stringify(payload)});toast('Факт сохранён');await openFact(fact.id);await load()}catch(e){showError(e.message)}finally{if($('save'))$('save').disabled=false}}
function showError(text){$('editorError').textContent=text}
async function review(action){try{await api('/api/admin/knowledge-studio/facts/'+encodeURIComponent(fact.id)+'/review',{method:'POST',body:JSON.stringify({action,comment:$('comment').value.trim()})});toast(action==='verify'?'Факт подтверждён':action==='publish'?'Факт опубликован':'Факт отклонён');await openFact(fact.id);await load()}catch(e){showError(e.message)}}
$('find').onclick=()=>{offset=0;load()};$('search').onkeydown=e=>{if(e.key==='Enter'){offset=0;load()}};$('prev').onclick=()=>{offset=Math.max(0,offset-limit);load()};$('next').onclick=()=>{offset+=limit;load()};$('close').onclick=()=>$('drawer').classList.add('hidden');$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').classList.add('hidden')};
Promise.all([loadPredicates()]).then(load).catch(e=>$('content').innerHTML=`<div class="error">${esc(e.message)}</div>`)
</script>
</body>
</html>
